nji": "内", "onyomi": "ナイ", "kunyomi": "うち", "meaning": "Inside"}, {"kanji": "口", "onyomi": "コウ・ク", "kunyomi": "くち", "meaning": "Mouth, Opening"}, {"kanji": "入", "onyomi": "ニュウ", "kunyomi": "—", "meaning": "Enter"}, {"kanji": "近", "onyomi": "キン", "kunyomi": "ちか(い)", "meaning": "Near"}, {"kanji": "遠", "onyomi": "エン", "kunyomi": "とお(い)", "meaning": "Far"}, {"kanji": "道", "onyomi": "みち", "kunyomi": "Road,", "meaning": "Way"}, {"kanji": "場", "onyomi": "ジョウ", "kunyomi": "ば", "meaning": "Place"}]}, "homework": {"text": "Write each of today's 17 kanji ten times, saying its meaning and one reading aloud each time."}}, {"number": 72, "week": 18, "day": "Thursday", "part": 3, "type": "review", "title": "Describing your daily schedule + reading practice", "note": "toki / nagara / tekara / madeni in one spoken routine.", "sections": [{"kind": "grammar", "items": [{"jp": "とき", "reading": "toki", "meaning": "when...", "register": "Noun-based conjunction", "explanation": "とき (\"time/occasion\") attaches to a verb, adjective, or noun+の to mean \"when.\" The tense of the clause before とき matters: 行くとき means \"when [I am about to] go,\" while 行ったとき means \"when [I] went/had gone\" — the timing is relative to the main action, not necessarily the present.", "structure": "Verb (dict./た) / い-adj / な-adj+な / Noun+の + とき", "examples": [{"jp": "日本(にほん)へ 行(い)くとき、パスポートが 要(い)ります。", "romaji": "Nihon e iku toki, pasupooto ga irimasu.", "en": "You need a passport when you go to Japan."}, {"jp": "子供(こども)のとき、よく 泳(およ)ぎました。", "romaji": "Kodomo no toki, yoku oyogimashita.", "en": "When I was a child, I swam often."}]}, {"jp": "ながら", "reading": "-nagara", "meaning": "while doing...", "register": "Verb conjugation", "explanation": "ながら joins two actions performed by the same person at the same time — attach it to the verb stem of the secondary action. The main clause carries the sentence's real focus: 音楽を聞きながら勉強します emphasizes studying, with music as the background activity.", "structure": "Verb stem + ながら、+ main verb", "examples": [{"jp": "音楽(おんがく)を 聞(き)きながら 勉強(べんきょう)します。", "romaji": "Ongaku o kikinagara benkyou shimasu.", "en": "I study while listening to music."}]}, {"jp": "前に／てから", "reading": "mae ni / -te kara", "meaning": "before doing... / after doing...", "register": "Time sequence", "explanation": "前に uses the dictionary form of the verb even when the sentence is about the past — because at the moment described, the action hasn't happened yet. てから attaches to the て-form and means \"after doing,\" emphasizing that the second action follows directly from completing the first.", "structure": "Verb-dictionary + 前(まえ)に　・　Verb-て + から", "examples": [{"jp": "寝(ね)る前(まえ)に、歯(は)を 磨(みが)きます。", "romaji": "Neru mae ni, ha o migakimasu.", "en": "I brush my teeth before sleeping."}, {"jp": "手(て)を 洗(あら)ってから、食(た)べます。", "romaji": "Te o aratte kara, tabemasu.", "en": "I eat after washing my hands."}]}, {"jp": "までに vs まで", "reading": "made ni / made", "meaning": "by (deadline) vs until (duration)", "register": "Particle contrast", "explanation": "These look almost identical but answer different questions. まで marks how long something continues (9時まで働きます = I work until 9). までに marks a deadline for a one-time action (9時までに来てください = please come by 9 — any time before or at 9 is fine, but not after).", "structure": "Time + までに + one-time action　・　Time + まで + continuous action", "examples": [{"jp": "5時(ごじ)までに 来(き)てください。", "romaji": "Go-ji made ni kite kudasai.", "en": "Please come by 5 o'clock."}, {"jp": "5時(ごじ)まで 会社(かいしゃ)に います。", "romaji": "Go-ji made kaisha ni imasu.", "en": "I'll be at the office until 5 o'clock."}]}]}, {"kind": "reading", "items": [{"num": "6", "topic": "日本の じてんしゃ 生活（Bicycle Life in Japan）", "jp": "日本では、じてんしゃを 使う 人が とても 多いです。\n学生は 学校へ 行く とき、じてんしゃに 乗る ことが あります。\n会社員も 駅まで じてんしゃで 行く ことが あります。\nスーパーや コンビニへ 行く ときも、じてんしゃは とても 便利です。\nでも、日本では じてんしゃの ルールを 守らなければなりません。\n夜に 乗る ときは、ライトを つけます。\n雨の 日に かさを さして 乗る のは あぶないです。\n駅の 前には、じてんしゃを とめる 場所が あります。\n正しい 場所に とめない と、じてんしゃを 持って行かれる ことも あります。\n日本で 生活する とき、じてんしゃの 使い方を 知っていると とても 役に 立ちます。", "romaji": "Nihon de wa, jitensha o tsukau hito ga totemo ooi desu.\nGakusei wa gakkou e iku toki, jitensha ni noru koto ga arimasu.\nKaishain mo eki made jitensha de iku koto ga arimasu.\nSuupaa ya konbini e iku toki mo, jitensha wa totemo benri desu.\nDemo, Nihon de wa jitensha no ruuru o mamoranakereba narimasen.\nYoru ni noru toki wa, raito o tsukemasu.\nAme no hi ni kasa o sashite noru no wa abunai desu.\nEki no mae ni wa, jitensha o tomeru basho ga arimasu.\nTadashii basho ni tomenai to, jitensha o motte ikareru koto mo arimasu.\nNihon de seikatsu suru toki, jitensha no tsukaikata o shitte iru to totemo yaku ni tachimasu.", "en": "In Japan, many people use bicycles.\nStudents sometimes ride bicycles when they go to school.\nOffice workers also sometimes go by bicycle to the station.\nWhen going to the supermarket or convenience store, bicycles are very convenient.\nHowever, in Japan, you must follow bicycle rules.\nWhen riding at night, you turn on the light.\nIt is dangerous to ride while holding an umbrella on rainy days.\nIn front of stations, there are places to park bicycles.\nIf you do not park in the correct place, your bicycle may be taken away.\nWhen living in Japan, knowing how to use bicycles is very useful.", "vocab": [["じてんしゃ", "じてんしゃ", "Bicycle"], ["使う", "つかう", "To use"], ["学生", "がくせい", "Student"], ["学校", "がっこう", "School"], ["会社員", "かいしゃいん", "Office worker"], ["駅", "えき", "Station"], ["便利", "べんり", "Convenient"], ["ルール", "ルール", "Rule"], ["守る", "まもる", "To follow / protect"], ["夜", "よる", "Night"], ["ライト", "ライト", "Light"], ["雨", "あめ", "Rain"], ["かさ", "かさ", "Umbrella"], ["あぶない", "あぶない", "Dangerous"], ["場所", "ばしょ", "Place"], ["正しい", "ただしい", "Correct"], ["生活", "せいかつ", "Life"], ["役に立つ", "やくにたつ", "Useful"]], "kanji_used": [["日本", "にほん", "Japan"], ["使う", "つかう", "To use"], ["人", "ひと", "Person"], ["多い", "おおい", "Many"], ["学生", "がくせい", "Student"], ["学校", "がっこう", "School"], ["行く", "いく", "To go"], ["乗る", "のる", "To ride"], ["会社員", "かいしゃいん", "Office worker"], ["駅", "えき", "Station"], ["便利", "べんり", "Convenient"], ["守る", "まもる", "To follow"], ["夜", "よる", "Night"], ["雨", "あめ", "Rain"], ["日", "ひ", "Day"], ["前", "まえ", "Front / before"], ["場所", "ばしょ", "Place"], ["正しい", "ただしい", "Correct"], ["持つ", "もつ", "To hold / carry"], ["生活", "せいかつ", "Life"], ["知る", "しる", "To know"], ["役", "やく", "Use / role"], ["立つ", "たつ", "To stand"]]}]}], "objectives": ["Use とき (toki) correctly in a full sentence.", "Use ながら (-nagara) correctly in a full sentence.", "Use 前に／てから (mae ni / -te kara) correctly in a full sentence.", "Use までに vs まで (made ni / made) correctly in a full sentence.", "Read a full N4-level passage and answer comprehension questions without translating word-by-word."], "warmup": {"kind": "text", "text": "Before looking below, try to recall one example sentence from last session's grammar point and say it out loud."}, "practice": {"kind": "grammar_blank", "text": "Cover the Japanese column below. Look only at the English, and try to say (or write) the Japanese sentence from memory. Then check yourself.", "items": [{"jp": "日本(にほん)へ 行(い)くとき、パスポートが 要(い)ります。", "romaji": "Nihon e iku toki, pasupooto ga irimasu.", "en": "You need a passport when you go to Japan."}, {"jp": "子供(こども)のとき、よく 泳(およ)ぎました。", "romaji": "Kodomo no toki, yoku oyogimashita.", "en": "When I was a child, I swam often."}, {"jp": "音楽(おんがく)を 聞(き)きながら 勉強(べんきょう)します。", "romaji": "Ongaku o kikinagara benkyou shimasu.", "en": "I study while listening to music."}, {"jp": "寝(ね)る前(まえ)に、歯(は)を 磨(みが)きます。", "romaji": "Neru mae ni, ha o migakimasu.", "en": "I brush my teeth before sleeping."}, {"jp": "手(て)を 洗(あら)ってから、食(た)べます。", "romaji": "Te o aratte kara, tabemasu.", "en": "I eat after washing my hands."}, {"jp": "5時(ごじ)までに 来(き)てください。", "romaji": "Go-ji made ni kite kudasai.", "en": "Please come by 5 o'clock."}, {"jp": "5時(ごじ)まで 会社(かいしゃ)に います。", "romaji": "Go-ji made kaisha ni imasu.", "en": "I'll be at the office until 5 o'clock."}]}, "homework": {"text": "Write five original sentences of your own using とき、ながら、前に／てから、までに vs まで. They can be simple — the goal is retrieval, not complexity."}, "checkpoint_quiz": {"title": "Weekly checkpoint quiz — Session 72", "instructions": "18 questions, 2 marks each (36 total). Score 70% or higher to pass. Covers everything since your last checkpoint.", "passmark_pct": 70, "questions": [{"kind": "mc", "prompt": "What does 「楓」 (Kaede) mean?", "options": ["Fern", "Bamboo", "Ivy", "Maple"], "answer": "Maple", "id": 1}, {"kind": "mc", "prompt": "What does 「松」 (Matsu) mean?", "options": ["Maple", "Pine", "Dandelion", "Fern"], "answer": "Pine", "id": 2}, {"kind": "mc", "prompt": "Fill in the blank: 音楽(おんがく)を 聞(き)き＿＿＿ 勉強(べんきょう)します。　(I study while listening to music.)", "options": ["ながら", "前に／てから", "とき", "までに vs まで"], "answer": "ながら", "id": 3}, {"kind": "mc", "prompt": "What does 「蒲公英」 (Tanpopo) mean?", "options": ["Dandelion", "Sunflower", "Lotus", "Cedar"], "answer": "Dandelion", "id": 4}, {"kind": "mc", "prompt": "What does 「蔦」 (Tsuta) mean?", "options": ["Maple", "Ivy", "Bamboo", "Pine"], "answer": "Ivy", "id": 5}, {"kind": "mc", "prompt": "What does 「竹」 (Take) mean?", "options": ["Dandelion", "Bamboo", "Ivy", "Cactus"], "answer": "Bamboo", "id": 6}, {"kind": "mc", "prompt": "What does 「空」 mean?", "options": ["Depart", "Mouth, Opening", "Empty", "Front"], "answer": "Empty", "id": 7}, {"kind": "mc", "prompt": "Fill in the blank: 日本(にほん)へ 行(い)く＿＿＿、パスポートが 要(い)ります。　(You need a passport when you go to Japan.)", "options": ["前に／てから", "とき", "ながら", "までに vs まで"], "answer": "とき", "id": 8}, {"kind": "mc", "prompt": "What does 「向日葵」 (Himawari) mean?", "options": ["Bamboo", "Sunflower", "Cactus", "Cedar"], "answer": "Sunflower", "id": 9}, {"kind": "mc", "prompt": "What does 「旅」 mean?", "options": ["East", "Left", "Electricity", "Travel, Trip"], "answer": "Travel, Trip", "id": 10}, {"kind": "mc", "prompt": "What does 「羊歯」 (Shida) mean?", "options": ["Sunflower", "Pine", "Fern", "Cedar"], "answer": "Fern", "id": 11}, {"kind": "mc", "prompt": "What does 「歩」 mean?", "options": ["Near", "North", "Walk", "Station"], "answer": "Walk", "id": 12}, {"kind": "mc", "prompt": "Fill in the blank: 寝(ね)る前(まえ)に、歯(は)を 磨(みが)きます。　(I brush my teeth before sleeping.)", "options": ["前に／てから", "とき", "ながら", "までに vs まで"], "answer": "前に／てから", "id": 13}, {"kind": "mc", "prompt": "What does 「蓮」 (Hasu) mean?", "options": ["Dandelion", "Cactus", "Lotus", "Ivy"], "answer": "Lotus", "id": 14}, {"kind": "mc", "prompt": "What does 「船」 mean?", "options": ["Ship, Boat", "North", "Walk", "New"], "answer": "Ship, Boat", "id": 15}, {"kind": "mc", "prompt": "What does 「線」 mean?", "options": ["Electricity", "Enter", "Harbor, Port", "Line"], "answer": "Line", "id": 16}, {"kind": "mc", "prompt": "What does 「近」 mean?", "options": ["Empty", "Near", "East", "Place"], "answer": "Near", "id": 17}, {"kind": "mc", "prompt": "Fill in the blank: 5時(ごじ)までに 来(き)てください。　(Please come by 5 o'clock.)", "options": ["とき", "までに vs まで", "前に／てから", "ながら"], "answer": "までに vs まで", "id": 18}]}}, {"number": 73, "week": 19, "day": "Monday", "part": 3, "type": "grammar", "title": "nakereba narimasen -- obligation", "note": "\"Must\" -- one of the most common N4 patterns.", "sections": [{"kind": "grammar", "items": [{"jp": "なければなりません", "reading": "-nakereba narimasen", "meaning": "must (do)", "register": "Obligation", "explanation": "Built from the ない-form (drop い, add ければ) plus なりません (\"it won't do [otherwise]\"), this is the standard N4 way to express obligation. It's long, but every piece is regular once you know the ない-form, and in casual speech it's often shortened to なきゃ.", "structure": "Verb ない-form (drop い) + ければなりません", "examples": [{"jp": "毎日(まいにち) 勉強(べんきょう)しなければなりません。", "romaji": "Mainichi benkyou shinakereba narimasen.", "en": "I must study every day."}, {"jp": "薬(くすり)を 飲(の)まなければなりません。", "romaji": "Kusuri o nomanakereba narimasen.", "en": "I have to take medicine."}]}]}], "objectives": ["Use なければなりません (-nakereba narimasen) correctly in a full sentence."], "warmup": {"kind": "text", "text": "Before looking below, try to recall one example sentence from last session's grammar point and say it out loud."}, "practice": {"kind": "grammar_blank", "text": "Cover the Japanese column below. Look only at the English, and try to say (or write) the Japanese sentence from memory. Then check yourself.", "items": [{"jp": "毎日(まいにち) 勉強(べんきょう)しなければなりません。", "romaji": "Mainichi benkyou shinakereba narimasen.", "en": "I must study every day."}, {"jp": "薬(くすり)を 飲(の)まなければなりません。", "romaji": "Kusuri o nomanakereba narimasen.", "en": "I have to take medicine."}]}, "homework": {"text": "Write five original sentences of your own using なければなりません. They can be simple — the goal is retrieval, not complexity."}}, {"number": 74, "week": 19, "day": "Tuesday", "part": 3, "type": "grammar", "title": "nakutemoiidesu -- \"you don't have to\"", "note": "", "sections": [{"kind": "grammar", "items": [{"jp": "なくてもいいです", "reading": "-nakute mo ii desu", "meaning": "don't have to (do)", "register": "Lack of obligation", "explanation": "The mirror image of てもいいです but built on the negative て-form (なくて) — literally \"even if [you] don't do it, it's fine.\" This is the correct way to say \"you don't have to,\" which is not the same meaning as てはいけません (\"you must not\").", "structure": "Verb ない-form (drop い) + くてもいいです", "examples": [{"jp": "今日(きょう)は 来(こ)なくてもいいです。", "romaji": "Kyou wa konakute mo ii desu.", "en": "You don't have to come today."}]}]}], "objectives": ["Use なくてもいいです (-nakute mo ii desu) correctly in a full sentence."], "warmup": {"kind": "text", "text": "Before looking below, try to recall one example sentence from last session's grammar point and say it out loud."}, "practice": {"kind": "grammar_blank", "text": "Cover the Japanese column below. Look only at the English, and try to say (or write) the Japanese sentence from memory. Then check yourself.", "items": [{"jp": "今日(きょう)は 来(こ)なくてもいいです。", "romaji": "Kyou wa konakute mo ii desu.", "en": "You don't have to come today."}]}, "homework": {"text": "Write five original sentences of your own using なくてもいいです. They can be simple — the goal is retrieval, not complexity."}}, {"number": 75, "week": 19, "day": "Wednesday", "part": 3, "type": "kanji", "title": "Kanji: Work & Office", "note": "", "sections": [{"kind": "kanji", "chapter": "Chapter 11 – Work & Office", "items": [{"kanji": "社", "onyomi": "シャ", "kunyomi": "やしろ", "meaning": "Company"}, {"kanji": "仕", "onyomi": "シ", "kunyomi": "つか(える)", "meaning": "Serve, Do"}, {"kanji": "事", "onyomi": "ジ・ズ", "kunyomi": "こと", "meaning": "Matter, Thing"}, {"kanji": "工", "onyomi": "コウ・ク", "kunyomi": "—", "meaning": "Craft, Construction"}, {"kanji": "場", "onyomi": "ジョウ", "kunyomi": "ば", "meaning": "Place"}, {"kanji": "長", "onyomi": "チョウ", "kunyomi": "なが(い)", "meaning": "Long, Leader"}, {"kanji": "同", "onyomi": "ドウ", "kunyomi": "おな(じ)", "meaning": "Same"}, {"kanji": "休", "onyomi": "キュウ", "kunyomi": "やす(む)", "meaning": "Rest, Holiday"}, {"kanji": "働", "onyomi": "ドウ", "kunyomi": "はたら(く)", "meaning": "Work"}, {"kanji": "作", "onyomi": "サク・サ", "kunyomi": "つく(る)", "meaning": "Make, Produce"}, {"kanji": "勤", "onyomi": "つと(める)", "kunyomi": "Work,", "meaning": "Service"}, {"kanji": "給", "onyomi": "キュウ", "kunyomi": "—", "meaning": "Supply, Pay"}, {"kanji": "料", "onyomi": "リョウ", "kunyomi": "—", "meaning": "Fee, Material"}, {"kanji": "名", "onyomi": "な", "kunyomi": "—", "meaning": "Name"}, {"kanji": "代", "onyomi": "ダイ・タイ", "kunyomi": "か(わる)", "meaning": "Generation, Substitute"}]}], "objectives": ["Read and write 15 new kanji, and recognize their on'yomi and kun'yomi."], "warmup": {"kind": "text", "text": "Write yesterday's (or last kanji session's) kanji from memory before starting today's new characters."}, "practice": {"kind": "kanji_drill", "text": "Cover the readings and meaning. Look only at the kanji shape and try to recall both readings and the meaning.", "items": [{"kanji": "社", "onyomi": "シャ", "kunyomi": "やしろ", "meaning": "Company"}, {"kanji": "仕", "onyomi": "シ", "kunyomi": "つか(える)", "meaning": "Serve, Do"}, {"kanji": "事", "onyomi": "ジ・ズ", "kunyomi": "こと", "meaning": "Matter, Thing"}, {"kanji": "工", "onyomi": "コウ・ク", "kunyomi": "—", "meaning": "Craft, Construction"}, {"kanji": "場", "onyomi": "ジョウ", "kunyomi": "ば", "meaning": "Place"}, {"kanji": "長", "onyomi": "チョウ", "kunyomi": "なが(い)", "meaning": "Long, Leader"}, {"kanji": "同", "onyomi": "ドウ", "kunyomi": "おな(じ)", "meaning": "Same"}, {"kanji": "休", "onyomi": "キュウ", "kunyomi": "やす(む)", "meaning": "Rest, Holiday"}, {"kanji": "働", "onyomi": "ドウ", "kunyomi": "はたら(く)", "meaning": "Work"}, {"kanji": "作", "onyomi": "サク・サ", "kunyomi": "つく(る)", "meaning": "Make, Produce"}, {"kanji": "勤", "onyomi": "つと(める)", "kunyomi": "Work,", "meaning": "Service"}, {"kanji": "給", "onyomi": "キュウ", "kunyomi": "—", "meaning": "Supply, Pay"}, {"kanji": "料", "onyomi": "リョウ", "kunyomi": "—", "meaning": "Fee, Material"}, {"kanji": "名", "onyomi": "な", "kunyomi": "—", "meaning": "Name"}, {"kanji": "代", "onyomi": "ダイ・タイ", "kunyomi": "か(わる)", "meaning": "Generation, Substitute"}]}, "homework": {"text": "Write each of today's 15 kanji ten times, saying its meaning and one reading aloud each time."}}, {"number": 76, "week": 19, "day": "Thursday", "part": 3, "type": "vocab", "title": "Getting-ready and clothing vocabulary + reading practice", "note": "", "sections": [{"kind": "topic_vocab", "topic": "Clothing & Accessories", "items": [{"en": "Clothes", "romaji": "fuku", "kana": "ふく", "kanji": "服"}, {"en": "Shirt", "romaji": "shatsu", "kana": "シャツ", "kanji": ""}, {"en": "Trousers", "romaji": "zubon", "kana": "ズボン", "kanji": ""}, {"en": "Shoes", "romaji": "kutsu", "kana": "くつ", "kanji": "靴"}, {"en": "Socks", "romaji": "kutsushita", "kana": "くつした", "kanji": "靴下"}, {"en": "Glasses", "romaji": "megane", "kana": "めがね", "kanji": "眼鏡"}, {"en": "Bag", "romaji": "kaban", "kana": "かばん", "kanji": "鞄"}, {"en": "Jacket", "romaji": "jaketto", "kana": "ジャケット", "kanji": ""}, {"en": "Belt", "romaji": "beruto", "kana": "ベルト", "kanji": ""}, {"en": "Necktie", "romaji": "nekutai", "kana": "ネクタイ", "kanji": ""}]}, {"kind": "reading", "items": [{"num": "2", "topic": "日本の スーパー（Japanese Supermarkets）", "jp": "日本の スーパーでは、食べ物や 生活に 必要な 物を 買う ことが できます。\n野菜、肉、魚、たまご、牛乳などが 売っています。\n夕方に なると、べんとうや おそうざいが 安く なる ことが あります。\n仕事の あとで スーパーへ 行く 人も 多いです。\n日本の スーパーでは、商品が とても きれいに ならべて あります。\n店の 中には、肉の ばしょ、魚の ばしょ、パンの ばしょが あります。\n買い物を する 前に、何を 買うか メモを 作ると べんりです。\nレジでは、自分で お金を 入れる きかいも あります。\nふくろが 必要な ときは、店の 人に 言います。\n日本で 生活する とき、スーパーの 使い方を 知っていると とても 役に 立ちます。", "romaji": "Nihon no suupaa de wa, tabemono ya seikatsu ni hitsuyou na mono o kau koto ga dekimasu.\nYasai, niku, sakana, tamago, gyuunyuu nado ga utte imasu.\nYuugata ni naru to, bentou ya osouzai ga yasuku naru koto ga arimasu.\nShigoto no ato de suupaa e iku hito mo ooi desu.\nNihon no suupaa de wa, shouhin ga totemo kirei ni narabete arimasu.\nMise no naka ni wa, niku no basho, sakana no basho, pan no basho ga arimasu.\nKaimono o suru mae ni, nani o kau ka memo o tsukuru to benri desu.\nReji de wa, jibun de okane o ireru kikai mo arimasu.\nFukuro ga hitsuyou na toki wa, mise no hito ni iimasu.\nNihon de seikatsu suru toki, suupaa no tsukaikata o shitte iru to totemo yaku ni tachimasu.", "en": "At Japanese supermarkets, you can buy food and things necessary for daily life.\nVegetables, meat, fish, eggs, milk, and other items are sold there.\nIn the evening, lunch boxes and prepared foods sometimes become cheaper.\nMany people go to the supermarket after work.\nIn Japanese supermarkets, products are arranged very neatly.\nInside the store, there are areas for meat, fish, and bread.\nBefore shopping, it is convenient to make a memo of what to buy.\nAt the register, there are also machines where you put in money by yourself.\nWhen you need a bag, you tell the store staff.\nWhen living in Japan, knowing how to use supermarkets is very useful.", "vocab": [["スーパー", "スーパー", "Supermarket"], ["食べ物", "たべもの", "Food"], ["生活", "せいかつ", "Daily life"], ["必要", "ひつよう", "Necessary"], ["物", "もの", "Thing"], ["野菜", "やさい", "Vegetables"], ["肉", "にく", "Meat"], ["魚", "さかな", "Fish"], ["牛乳", "ぎゅうにゅう", "Milk"], ["売っています", "うっています", "Is sold"], ["安い", "やすい", "Cheap"], ["仕事", "しごと", "Work"], ["商品", "しょうひん", "Product"], ["買い物", "かいもの", "Shopping"], ["レジ", "レジ", "Cash register"], ["お金", "おかね", "Money"], ["ふくろ", "ふくろ", "Bag"], ["役に立つ", "やくにたつ", "Useful"]], "kanji_used": [["日本", "にほん", "Japan"], ["食べ物", "たべもの", "Food"], ["生活", "せいかつ", "Life"], ["必要", "ひつよう", "Necessary"], ["物", "もの", "Thing"], ["買う", "かう", "To buy"], ["野菜", "やさい", "Vegetables"], ["肉", "にく", "Meat"], ["魚", "さかな", "Fish"], ["牛乳", "ぎゅうにゅう", "Milk"], ["売る", "うる", "To sell"], ["夕方", "ゆうがた", "Evening"], ["安い", "やすい", "Cheap"], ["仕事", "しごと", "Work"], ["多い", "おおい", "Many"], ["商品", "しょうひん", "Product"], ["店", "みせ", "Shop"], ["中", "なか", "Inside"], ["何", "なに", "What"], ["作る", "つくる", "To make"], ["自分", "じぶん", "Oneself"], ["お金", "おかね", "Money"], ["言う", "いう", "To say"], ["知る", "しる", "To know"], ["役", "やく", "Use / role"], ["立つ", "たつ", "To stand"]]}]}], "objectives": ["Recall 10 clothing & accessories words in both directions (JP→EN and EN→JP).", "Read a full N4-level passage and answer comprehension questions without translating word-by-word."], "warmup": {"kind": "text", "text": "Name as many words as you can from last week's vocabulary topic before starting today's new set."}, "practice": {"kind": "vocab_match", "text": "Cover the English column and recall each word's meaning from the Japanese alone. Then cover the Japanese and go the other direction.", "items": [{"jp": "服", "kana": "ふく", "romaji": "fuku", "en": "Clothes"}, {"jp": "シャツ", "kana": "シャツ", "romaji": "shatsu", "en": "Shirt"}, {"jp": "ズボン", "kana": "ズボン", "romaji": "zubon", "en": "Trousers"}, {"jp": "靴", "kana": "くつ", "romaji": "kutsu", "en": "Shoes"}, {"jp": "靴下", "kana": "くつした", "romaji": "kutsushita", "en": "Socks"}, {"jp": "眼鏡", "kana": "めがね", "romaji": "megane", "en": "Glasses"}, {"jp": "鞄", "kana": "かばん", "romaji": "kaban", "en": "Bag"}, {"jp": "ジャケット", "kana": "ジャケット", "romaji": "jaketto", "en": "Jacket"}, {"jp": "ベルト", "kana": "ベルト", "romaji": "beruto", "en": "Belt"}, {"jp": "ネクタイ", "kana": "ネクタイ", "romaji": "nekutai", "en": "Necktie"}]}, "homework": {"text": "Label five real objects or write five real sentences using today's clothing & accessories words."}}, {"number": 77, "week": 20, "day": "Monday", "part": 3, "type": "grammar", "title": "tahouga ii / naihouga ii -- advice", "note": "", "sections": [{"kind": "grammar", "items": [{"jp": "たほうがいいです／ないほうがいいです", "reading": "-ta hou ga ii / -nai hou ga ii", "meaning": "should... / shouldn't...", "register": "Advice", "explanation": "Despite using the past-tense た-form, たほうがいいです gives present advice — literally \"the option of having done X is better.\" The negative advice form uses the plain ない-form instead, not a past form: ないほうがいいです.", "structure": "Verb-た + ほうがいいです　・　Verb-ない + ほうがいいです", "examples": [{"jp": "早(はや)く 寝(ね)たほうがいいです。", "romaji": "Hayaku neta hou ga ii desu.", "en": "You should sleep early."}, {"jp": "お酒(さけ)を 飲(の)まないほうがいいです。", "romaji": "Osake o nomanai hou ga ii desu.", "en": "You shouldn't drink alcohol."}]}]}], "objectives": ["Use たほうがいいです／ないほうがいいです (-ta hou ga ii / -nai hou ga ii) correctly in a full sentence."], "warmup": {"kind": "text", "text": "Before looking below, try to recall one example sentence from last session's grammar point and say it out loud."}, "practice": {"kind": "grammar_blank", "text": "Cover the Japanese column below. Look only at the English, and try to say (or write) the Japanese sentence from memory. Then check yourself.", "items": [{"jp": "早(はや)く 寝(ね)たほうがいいです。", "romaji": "Hayaku neta hou ga ii desu.", "en": "You should sleep early."}, {"jp": "お酒(さけ)を 飲(の)まないほうがいいです。", "romaji": "Osake o nomanai hou ga ii desu.", "en": "You shouldn't drink alcohol."}]}, "homework": {"text": "Write five original sentences of your own using たほうがいいです／ないほうがいいです. They can be simple — the goal is retrieval, not complexity."}}, {"number": 78, "week": 20, "day": "Tuesday", "part": 3, "type": "grammar", "title": "ta koto ga arimasu, revisited", "note": "Experience, at N4 depth.", "sections": [{"kind": "grammar", "items": [{"jp": "たことがある", "reading": "-ta koto ga aru", "meaning": "have (ever) done...", "register": "Verb conjugation", "explanation": "This pattern reports life experience, not a specific past event — \"I have the experience of having done X at some point.\" It's built on the plain past (た-form), which you'll learn fully in the verb-types session, but it's useful enough to introduce early with a handful of common verbs.", "structure": "Verb-た (plain past) + ことがあります", "examples": [{"jp": "日本(にほん)へ 行(い)ったことがあります。", "romaji": "Nihon e itta koto ga arimasu.", "en": "I have been to Japan (before)."}, {"jp": "すしを 食(た)べたことがありません。", "romaji": "Sushi o tabeta koto ga arimasen.", "en": "I have never eaten sushi."}]}]}], "objectives": ["Use たことがある (-ta koto ga aru) correctly in a full sentence."], "warmup": {"kind": "text", "text": "Before looking below, try to recall one example sentence from last session's grammar point and say it out loud."}, "practice": {"kind": "grammar_blank", "text": "Cover the Japanese column below. Look only at the English, and try to say (or write) the Japanese sentence from memory. Then check yourself.", "items": [{"jp": "日本(にほん)へ 行(い)ったことがあります。", "romaji": "Nihon e itta koto ga arimasu.", "en": "I have been to Japan (before)."}, {"jp": "すしを 食(た)べたことがありません。", "romaji": "Sushi o tabeta koto ga arimasen.", "en": "I have never eaten sushi."}]}, "homework": {"text": "Write five original sentences of your own using たことがある. They can be simple — the goal is retrieval, not complexity."}}, {"number": 79, "week": 20, "day": "Wednesday", "part": 3, "type": "vocab", "title": "Sickness and hospital vocabulary + reading practice", "note": "", "sections": [{"kind": "topic_vocab", "topic": "Sickness & Symptoms", "items": [{"en": "Fever", "romaji": "Netsu", "kana": "ねつ", "kanji": "熱"}, {"en": "Cough", "romaji": "Seki", "kana": "せき", "kanji": "咳"}, {"en": "Diarrhea", "romaji": "Geri", "kana": "げり", "kanji": "下痢"}, {"en": "Constipation", "romaji": "Benpi", "kana": "べんぴ", "kanji": "便秘"}, {"en": "Dizziness", "romaji": "Memai", "kana": "めまい", "kanji": "目眩"}, {"en": "Fatigue", "romaji": "Hirou", "kana": "ひろう", "kanji": "疲労"}, {"en": "Chills", "romaji": "Samuke", "kana": "さむけ", "kanji": "寒気"}, {"en": "Runny nose", "romaji": "Hana mizu", "kana": "はなみず", "kanji": "鼻水"}, {"en": "Sneezing", "romaji": "Kushami", "kana": "くしゃみ", "kanji": ""}, {"en": "Cramp", "romaji": "Keiren", "kana": "けいれん", "kanji": "痙攣"}, {"en": "Sweating", "romaji": "Ase", "kana": "あせ", "kanji": "汗"}]}, {"kind": "reading", "items": [{"num": "3", "topic": "日本の 病院（Japanese Hospitals）", "jp": "日本で 病気に なった ときは、病院へ 行きます。\nかぜを ひいた ときや、熱が ある ときも、病院で 診てもらう ことが できます。\n病院へ 行く 前に、健康保険証を 持って 行きます。\nはじめての 病院では、名前、住所、電話番号を 書く ことが あります。\n受付の 人に 症状を かんたんに 伝えます。\nたとえば、「頭が 痛いです」や「おなかが 痛いです」と 言います。\n先生は いろいろな 質問を します。\nそのあと、薬を もらう ために 薬局へ 行く ことも あります。\n薬の 飲み方を よく 読んで、正しく 飲む ことが 大切です。\n日本で 安心して 生活する ために、病院の 使い方を 知っておきましょう。", "romaji": "Nihon de byouki ni natta toki wa, byouin e ikimasu.\nKaze o hiita toki ya, netsu ga aru toki mo, byouin de mite morau koto ga dekimasu.\nByouin e iku mae ni, kenkou hokenshou o motte ikimasu.\nHajimete no byouin de wa, namae, juusho, denwa bangou o kaku koto ga arimasu.\nUketsuke no hito ni shoujou o kantan ni tsutaemasu.\nTatoeba, “atama ga itai desu” ya “onaka ga itai desu” to iimasu.\nSensei wa iroiro na shitsumon o shimasu.\nSono ato, kusuri o morau tame ni yakkyoku e iku koto mo arimasu.\nKusuri no nomikata o yoku yonde, tadashiku nomu koto ga taisetsu desu.\nNihon de anshin shite seikatsu suru tame ni, byouin no tsukaikata o shitte okimashou.", "en": "When you get sick in Japan, you go to a hospital or clinic.\nWhen you catch a cold or have a fever, you can also be examined at a hospital.\nBefore going to the hospital, you take your health insurance card with you.\nAt a hospital you visit for the first time, you may write your name, address, and phone number.\nYou tell the receptionist your symptoms simply.\nFor example, you say, “I have a headache” or “My stomach hurts.”\nThe doctor asks various questions.\nAfter that, you may go to a pharmacy to get medicine.\nIt is important to read how to take the medicine and take it correctly.\nTo live safely in Japan, let’s know how to use hospitals.", "vocab": [["病気", "びょうき", "Illness"], ["病院", "びょういん", "Hospital / clinic"], ["かぜ", "かぜ", "Cold"], ["熱", "ねつ", "Fever"], ["健康保険証", "けんこうほけんしょう", "Health insurance card"], ["名前", "なまえ", "Name"], ["住所", "じゅうしょ", "Address"], ["電話番号", "でんわばんごう", "Phone number"], ["受付", "うけつけ", "Reception"], ["症状", "しょうじょう", "Symptoms"], ["頭", "あたま", "Head"], ["痛い", "いたい", "Painful"], ["先生", "せんせい", "Doctor / teacher"], ["質問", "しつもん", "Question"], ["薬", "くすり", "Medicine"], ["薬局", "やっきょく", "Pharmacy"], ["飲み方", "のみかた", "How to take / drink"], ["正しい", "ただしい", "Correct"]], "kanji_used": [["日本", "にほん", "Japan"], ["病気", "びょうき", "Illness"], ["病院", "びょういん", "Hospital"], ["行く", "いく", "To go"], ["熱", "ねつ", "Fever"], ["診る", "みる", "To examine"], ["前", "まえ", "Before"], ["健康", "けんこう", "Health"], ["保険証", "ほけんしょう", "Insurance card"], ["持つ", "もつ", "To carry"], ["名前", "なまえ", "Name"], ["住所", "じゅうしょ", "Address"], ["電話番号", "でんわばんごう", "Phone number"], ["書く", "かく", "To write"], ["受付", "うけつけ", "Reception"], ["人", "ひと", "Person"], ["症状", "しょうじょう", "Symptom"], ["頭", "あたま", "Head"], ["痛い", "いたい", "Painful"], ["言う", "いう", "To say"], ["先生", "せんせい", "Doctor / teacher"], ["質問", "しつもん", "Question"], ["薬", "くすり", "Medicine"], ["読む", "よむ", "To read"], ["正しい", "ただしい", "Correct"], ["大切", "たいせつ", "Important"], ["生活", "せいかつ", "Life"], ["知る", "しる", "To know"]]}]}], "objectives": ["Recall 11 sickness & symptoms words in both directions (JP→EN and EN→JP).", "Read a full N4-level passage and answer comprehension questions without translating word-by-word."], "warmup": {"kind": "text", "text": "Name as many words as you can from last week's vocabulary topic before starting today's new set."}, "practice": {"kind": "vocab_match", "text": "Cover the English column and recall each word's meaning from the Japanese alone. Then cover the Japanese and go the other direction.", "items": [{"jp": "熱", "kana": "ねつ", "romaji": "Netsu", "en": "Fever"}, {"jp": "咳", "kana": "せき", "romaji": "Seki", "en": "Cough"}, {"jp": "下痢", "kana": "げり", "romaji": "Geri", "en": "Diarrhea"}, {"jp": "便秘", "kana": "べんぴ", "romaji": "Benpi", "en": "Constipation"}, {"jp": "目眩", "kana": "めまい", "romaji": "Memai", "en": "Dizziness"}, {"jp": "疲労", "kana": "ひろう", "romaji": "Hirou", "en": "Fatigue"}, {"jp": "寒気", "kana": "さむけ", "romaji": "Samuke", "en": "Chills"}, {"jp": "鼻水", "kana": "はなみず", "romaji": "Hana mizu", "en": "Runny nose"}, {"jp": "くしゃみ", "kana": "くしゃみ", "romaji": "Kushami", "en": "Sneezing"}, {"jp": "痙攣", "kana": "けいれん", "romaji": "Keiren", "en": "Cramp"}, {"jp": "汗", "kana": "あせ", "romaji": "Ase", "en": "Sweating"}]}, "homework": {"text": "Label five real objects or write five real sentences using today's sickness & symptoms words."}}, {"number": 80, "week": 20, "day": "Thursday", "part": 3, "type": "review", "title": "Giving advice to a friend", "note": "Obligation + advice + experience in one dialogue.", "sections": [{"kind": "grammar", "items": [{"jp": "なければなりません", "reading": "-nakereba narimasen", "meaning": "must (do)", "register": "Obligation", "explanation": "Built from the ない-form (drop い, add ければ) plus なりません (\"it won't do [otherwise]\"), this is the standard N4 way to express obligation. It's long, but every piece is regular once you know the ない-form, and in casual speech it's often shortened to なきゃ.", "structure": "Verb ない-form (drop い) + ければなりません", "examples": [{"jp": "毎日(まいにち) 勉強(べんきょう)しなければなりません。", "romaji": "Mainichi benkyou shinakereba narimasen.", "en": "I must study every day."}, {"jp": "薬(くすり)を 飲(の)まなければなりません。", "romaji": "Kusuri o nomanakereba narimasen.", "en": "I have to take medicine."}]}, {"jp": "たほうがいいです／ないほうがいいです", "reading": "-ta hou ga ii / -nai hou ga ii", "meaning": "should... / shouldn't...", "register": "Advice", "explanation": "Despite using the past-tense た-form, たほうがいいです gives present advice — literally \"the option of having done X is better.\" The negative advice form uses the plain ない-form instead, not a past form: ないほうがいいです.", "structure": "Verb-た + ほうがいいです　・　Verb-ない + ほうがいいです", "examples": [{"jp": "早(はや)く 寝(ね)たほうがいいです。", "romaji": "Hayaku neta hou ga ii desu.", "en": "You should sleep early."}, {"jp": "お酒(さけ)を 飲(の)まないほうがいいです。", "romaji": "Osake o nomanai hou ga ii desu.", "en": "You shouldn't drink alcohol."}]}]}], "objectives": ["Use なければなりません (-nakereba narimasen) correctly in a full sentence.", "Use たほうがいいです／ないほうがいいです (-ta hou ga ii / -nai hou ga ii) correctly in a full sentence."], "warmup": {"kind": "text", "text": "Before looking below, try to recall one example sentence from last session's grammar point and say it out loud."}, "practice": {"kind": "grammar_blank", "text": "Cover the Japanese column below. Look only at the English, and try to say (or write) the Japanese sentence from memory. Then check yourself.", "items": [{"jp": "毎日(まいにち) 勉強(べんきょう)しなければなりません。", "romaji": "Mainichi benkyou shinakereba narimasen.", "en": "I must study every day."}, {"jp": "薬(くすり)を 飲(の)まなければなりません。", "romaji": "Kusuri o nomanakereba narimasen.", "en": "I have to take medicine."}, {"jp": "早(はや)く 寝(ね)たほうがいいです。", "romaji": "Hayaku neta hou ga ii desu.", "en": "You should sleep early."}, {"jp": "お酒(さけ)を 飲(の)まないほうがいいです。", "romaji": "Osake o nomanai hou ga ii desu.", "en": "You shouldn't drink alcohol."}]}, "homework": {"text": "Write five original sentences of your own using なければなりません、たほうがいいです／ないほうがいいです. They can be simple — the goal is retrieval, not complexity."}, "checkpoint_quiz": {"title": "Weekly checkpoint quiz — Session 80", "instructions": "18 questions, 2 marks each (36 total). Score 70% or higher to pass. Covers everything since your last checkpoint.", "passmark_pct": 70, "questions": [{"kind": "mc", "prompt": "What does 「下痢」 (Geri) mean?", "options": ["Diarrhea", "Fever", "Runny nose", "Fatigue"], "answer": "Diarrhea", "id": 1}, {"kind": "mc", "prompt": "What does 「便秘」 (Benpi) mean?", "options": ["Fatigue", "Constipation", "Glasses", "Bag"], "answer": "Constipation", "id": 2}, {"kind": "mc", "prompt": "Fill in the blank: 毎日(まいにち) 勉強(べんきょう)し＿＿＿。　(I must study every day.)", "options": ["なければなりません", "たほうがいいです／ないほうがいいです", "たことがある", "なくてもいいです"], "answer": "なければなりません", "id": 3}, {"kind": "mc", "prompt": "What does 「休」 mean?", "options": ["Craft, Construction", "Rest, Holiday", "Long, Leader", "Make, Produce"], "answer": "Rest, Holiday", "id": 4}, {"kind": "mc", "prompt": "What does 「給」 mean?", "options": ["Serve, Do", "Generation, Substitute", "Same", "Supply, Pay"], "answer": "Supply, Pay", "id": 5}, {"kind": "mc", "prompt": "What does 「ジャケット」 (jaketto) mean?", "options": ["Socks", "Belt", "Jacket", "Dizziness"], "answer": "Jacket", "id": 6}, {"kind": "mc", "prompt": "What does 「ベルト」 (beruto) mean?", "options": ["Belt", "Constipation", "Socks", "Glasses"], "answer": "Belt", "id": 7}, {"kind": "mc", "prompt": "What does 「眼鏡」 (megane) mean?", "options": ["Glasses", "Constipation", "Shoes", "Diarrhea"], "answer": "Glasses", "id": 8}, {"kind": "mc", "prompt": "Fill in the blank: 今日(きょう)は 来(こ)＿＿＿。　(You don't have to come today.)", "options": ["なくてもいいです", "たことがある", "たほうがいいです／ないほうがいいです", "なければなりません"], "answer": "なくてもいいです", "id": 9}, {"kind": "mc", "prompt": "What does 「同」 mean?", "options": ["Name", "Place", "Supply, Pay", "Same"], "answer": "Same", "id": 10}, {"kind": "mc", "prompt": "What does 「料」 mean?", "options": ["Service", "Supply, Pay", "Matter, Thing", "Fee, Material"], "answer": "Fee, Material", "id": 11}, {"kind": "mc", "prompt": "Fill in the blank: 早(はや)く 寝(ね)たほうがいいです。　(You should sleep early.)", "options": ["なくてもいいです", "たほうがいいです／ないほうがいいです", "たことがある", "なければなりません"], "answer": "たほうがいいです／ないほうがいいです", "id": 12}, {"kind": "mc", "prompt": "What does 「服」 (fuku) mean?", "options": ["Trousers", "Chills", "Runny nose", "Clothes"], "answer": "Clothes", "id": 13}, {"kind": "mc", "prompt": "What does 「場」 mean?", "options": ["Serve, Do", "Company", "Place", "Same"], "answer": "Place", "id": 14}, {"kind": "mc", "prompt": "Fill in the blank: 日本(にほん)へ 行(い)ったことがあります。　(I have been to Japan (before).)", "options": ["なければなりません", "なくてもいいです", "たほうがいいです／ないほうがいいです", "たことがある"], "answer": "たことがある", "id": 15}, {"kind": "mc", "prompt": "What does 「靴」 (kutsu) mean?", "options": ["Diarrhea", "Sweating", "Dizziness", "Shoes"], "answer": "Shoes", "id": 16}, {"kind": "mc", "prompt": "What does 「働」 mean?", "options": ["Serve, Do", "Work", "Company", "Matter, Thing"], "answer": "Work", "id": 17}, {"kind": "mc", "prompt": "What does 「鼻水」 (Hana mizu) mean?", "options": ["Socks", "Sneezing", "Fever", "Runny nose"], "answer": "Runny nose", "id": 18}]}}, {"number": 81, "week": 21, "day": "Monday", "part": 3, "type": "grammar", "title": "agemasu, kuremasu, moraimasu -- giving and receiving", "note": "The direction-of-giving system that trips up most learners.", "sections": [{"kind": "grammar", "items": [{"jp": "あげます・くれます・もらいます", "reading": "agemasu / kuremasu / moraimasu", "meaning": "give / give (to me) / receive", "register": "Giving & receiving verbs", "explanation": "Japanese grammatically encodes the direction a gift moves relative to the speaker. あげます is used when you (or someone else) give to another person — but never when someone gives to you. くれます is reserved for someone giving to you or your in-group — it always faces inward. もらいます flips the particle: the receiver is marked with は/が, and the giver takes に or から.", "structure": "Giver + が + Receiver + に + Object + を + あげます／くれます　・　Receiver + が + Giver + に／から + Object + を + もらいます", "examples": [{"jp": "友達(ともだち)に 本(ほん)を あげました。", "romaji": "Tomodachi ni hon o agemashita.", "en": "I gave my friend a book."}, {"jp": "先生(せんせい)が 本(ほん)を くれました。", "romaji": "Sensei ga hon o kuremashita.", "en": "My teacher gave me a book."}, {"jp": "母(はは)に 手紙(てがみ)を もらいました。", "romaji": "Haha ni tegami o moraimashita.", "en": "I received a letter from my mother."}]}]}], "objectives": ["Use あげます・くれます・もらいます (agemasu / kuremasu / moraimasu) correctly in a full sentence."], "warmup": {"kind": "text", "text": "Before looking below, try to recall one example sentence from last session's grammar point and say it out loud."}, "practice": {"kind": "grammar_blank", "text": "Cover the Japanese column below. Look only at the English, and try to say (or write) the Japanese sentence from memory. Then check yourself.", "items": [{"jp": "友達(ともだち)に 本(ほん)を あげました。", "romaji": "Tomodachi ni hon o agemashita.", "en": "I gave my friend a book."}, {"jp": "先生(せんせい)が 本(ほん)を くれました。", "romaji": "Sensei ga hon o kuremashita.", "en": "My teacher gave me a book."}]}, "homework": {"text": "Write five original sentences of your own using あげます・くれます・もらいます. They can be simple — the goal is retrieval, not complexity."}}, {"number": 82, "week": 21, "day": "Tuesday", "part": 3, "type": "grammar", "title": "te ageru, te kureru, te morau -- doing favors", "note": "", "sections": [{"kind": "grammar", "items": [{"jp": "てあげる・てくれる・てもらう", "reading": "-te ageru / -te kureru / -te morau", "meaning": "do a favor for... / someone does a favor for me / have someone do...", "register": "て-form + giving/receiving", "explanation": "Attach the same giving/receiving verbs to a て-form to talk about favors instead of objects. てくれる is especially common and warm — it's how you say someone did something nice for you, unprompted. てもらう instead frames it as \"I had/got [someone] to do it for me.\"", "structure": "Verb-て + あげる／くれる／もらう", "examples": [{"jp": "友達(ともだち)が 駅(えき)まで 送(おく)ってくれました。", "romaji": "Tomodachi ga eki made okutte kuremashita.", "en": "My friend walked/drove me to the station (for me)."}, {"jp": "先生(せんせい)に 漢字(かんじ)を 教(おし)えてもらいました。", "romaji": "Sensei ni kanji o oshiete moraimashita.", "en": "I had my teacher teach me kanji."}]}]}], "objectives": ["Use てあげる・てくれる・てもらう (-te ageru / -te kureru / -te morau) correctly in a full sentence."], "warmup": {"kind": "text", "text": "Before looking below, try to recall one example sentence from last session's grammar point and say it out loud."}, "practice": {"kind": "grammar_blank", "text": "Cover the Japanese column below. Look only at the English, and try to say (or write) the Japanese sentence from memory. Then check yourself.", "items": [{"jp": "友達(ともだち)が 駅(えき)まで 送(おく)ってくれました。", "romaji": "Tomodachi ga eki made okutte kuremashita.", "en": "My friend walked/drove me to the station (for me)."}, {"jp": "先生(せんせい)に 漢字(かんじ)を 教(おし)えてもらいました。", "romaji": "Sensei ni kanji o oshiete moraimashita.", "en": "I had my teacher teach me kanji."}]}, "homework": {"text": "Write five original sentences of your own using てあげる・てくれる・てもらう. They can be simple — the goal is retrieval, not complexity."}}, {"number": 83, "week": 21, "day": "Wednesday", "part": 3, "type": "kanji", "title": "Kanji: Shopping & Money", "note": "", "sections": [{"kind": "kanji", "chapter": "Chapter 12 – Shopping & Money", "items": [{"kanji": "買", "onyomi": "バイ", "kunyomi": "か(う)", "meaning": "Buy"}, {"kanji": "売", "onyomi": "バイ", "kunyomi": "う(る)", "meaning": "Sell"}, {"kanji": "円", "onyomi": "エン", "kunyomi": "まる(い)", "meaning": "Yen, Circle"}, {"kanji": "安", "onyomi": "アン", "kunyomi": "やす(い)", "meaning": "Cheap, Safe"}, {"kanji": "店", "onyomi": "テン", "kunyomi": "みせ", "meaning": "Shop"}, {"kanji": "紙", "onyomi": "シ", "kunyomi": "かみ", "meaning": "Paper"}, {"kanji": "赤", "onyomi": "セキ・シ", "kunyomi": "あか・あか", "meaning": "Red"}, {"kanji": "茶", "onyomi": "チャ・サ", "kunyomi": "—", "meaning": "Tea, Brown"}, {"kanji": "貸", "onyomi": "タイ", "kunyomi": "か(す)", "meaning": "Lend"}, {"kanji": "借", "onyomi": "シャク", "kunyomi": "か(りる)", "meaning": "Borrow"}, {"kanji": "値", "onyomi": "チ", "kunyomi": "ね・あたい", "meaning": "Price, Value"}]}], "objectives": ["Read and write 11 new kanji, and recognize their on'yomi and kun'yomi."], "warmup": {"kind": "text", "text": "Write yesterday's (or last kanji session's) kanji from memory before starting today's new characters."}, "practice": {"kind": "kanji_drill", "text": "Cover the readings and meaning. Look only at the kanji shape and try to recall both readings and the meaning.", "items": [{"kanji": "買", "onyomi": "バイ", "kunyomi": "か(う)", "meaning": "Buy"}, {"kanji": "売", "onyomi": "バイ", "kunyomi": "う(る)", "meaning": "Sell"}, {"kanji": "円", "onyomi": "エン", "kunyomi": "まる(い)", "meaning": "Yen, Circle"}, {"kanji": "安", "onyomi": "アン", "kunyomi": "やす(い)", "meaning": "Cheap, Safe"}, {"kanji": "店", "onyomi": "テン", "kunyomi": "みせ", "meaning": "Shop"}, {"kanji": "紙", "onyomi": "シ", "kunyomi": "かみ", "meaning": "Paper"}, {"kanji": "赤", "onyomi": "セキ・シ", "kunyomi": "あか・あか", "meaning": "Red"}, {"kanji": "茶", "onyomi": "チャ・サ", "kunyomi": "—", "meaning": "Tea, Brown"}, {"kanji": "貸", "onyomi": "タイ", "kunyomi": "か(す)", "meaning": "Lend"}, {"kanji": "借", "onyomi": "シャク", "kunyomi": "か(りる)", "meaning": "Borrow"}, {"kanji": "値", "onyomi": "チ", "kunyomi": "ね・あたい", "meaning": "Price, Value"}]}, "homework": {"text": "Write each of today's 11 kanji ten times, saying its meaning and one reading aloud each time."}}, {"number": 84, "week": 21, "day": "Thursday", "part": 3, "type": "vocab", "title": "Shopping and money vocabulary + reading practice", "note": "", "sections": [{"kind": "topic_vocab", "topic": "Shopping Vocabulary", "items": [{"en": "Shop", "romaji": "Mise", "kana": "みせ", "kanji": "店"}, {"en": "Discount", "romaji": "Waribiki", "kana": "わりびき", "kanji": "割引"}, {"en": "Consumption Tax", "romaji": "Shouhi zei", "kana": "しょうひぜい", "kanji": "消費税"}, {"en": "Cash", "romaji": "Genkin", "kana": "げんきん", "kanji": "現金"}, {"en": "Bag", "romaji": "Fukuro", "kana": "ふくろ", "kanji": "袋"}, {"en": "Refund", "romaji": "Henkin", "kana": "へんきん", "kanji": "返金"}, {"en": "Color", "romaji": "Iro", "kana": "いろ", "kanji": "色"}, {"en": "Try on", "romaji": "Shichaku", "kana": "しちゃく", "kanji": "試着"}, {"en": "Shelf", "romaji": "Tana", "kana": "たな", "kanji": "棚"}, {"en": "Checkout / counter", "romaji": "Reji", "kana": "レジ", "kanji": ""}]}, {"kind": "reading", "items": [{"num": "9", "topic": "日本の 宅配便（Delivery Service in Japan）", "jp": "日本では、宅配便の サービスが とても 便利です。\n荷物を 家まで 届けて もらう ことが できます。\nインターネットで 買い物を すると、商品が 宅配便で 来る ことが 多いです。\n家に いない ときは、不在票が ポストに 入っています。\n不在票には、荷物の 番号や 配達の 会社の 名前が 書いてあります。\nもう一度 配達して ほしい ときは、電話や インターネットで 連絡します。\n時間を 決めて、荷物を 受け取る ことも できます。\n荷物を 受け取る ときは、名前を 書いたり、はんこを 使ったり します。\nコンビニで 荷物を 受け取る ことが できる 場合も あります。\n日本で 生活する とき、宅配便を 使える と とても 便利です。", "romaji": "Nihon de wa, takuhaibin no saabisu ga totemo benri desu.\nNimotsu o ie made todokete morau koto ga dekimasu.\nIntaanetto de kaimono o suru to, shouhin ga takuhaibin de kuru koto ga ooi desu.\nIe ni inai toki wa, fuzaihyou ga posuto ni haitte imasu.\nFuzaihyou ni wa, nimotsu no bangou ya haitatsu no kaisha no namae ga kaite arimasu.\nMou ichido haitatsu shite hoshii toki wa, denwa ya intaanetto de renraku shimasu.\nJikan o kimete, nimotsu o uketoru koto mo dekimasu.\nNimotsu o uketoru toki wa, namae o kaitari, hanko o tsukattari shimasu.\nKonbini de nimotsu o uketoru koto ga dekiru baai mo arimasu.\nNihon de seikatsu suru toki, takuhaibin o tsukaeru to totemo benri desu.", "en": "In Japan, delivery services are very convenient.\nYou can have packages delivered to your home.\nWhen you shop online, products often come by delivery service.\nWhen you are not at home, a delivery notice is put in your mailbox.\nOn the notice, the package number, delivery company, and name are written.\nWhen you want the package delivered again, you contact them by phone or internet.\nYou can also decide a time and receive the package.\nWhen receiving a package, you write your name or use a personal seal.\nIn some cases, you can receive packages at convenience stores.\nWhen living in Japan, being able to use delivery services is very convenient.", "vocab": [["宅配便", "たくはいびん", "Delivery service"], ["サービス", "サービス", "Service"], ["荷物", "にもつ", "Package / luggage"], ["家", "いえ", "Home / house"], ["届ける", "とどける", "To deliver"], ["買い物", "かいもの", "Shopping"], ["商品", "しょうひん", "Product"], ["不在票", "ふざいひょう", "Delivery notice"], ["ポスト", "ポスト", "Mailbox"], ["番号", "ばんごう", "Number"], ["配達", "はいたつ", "Delivery"], ["会社", "かいしゃ", "Company"], ["名前", "なまえ", "Name"], ["もう一度", "もういちど", "One more time"], ["電話", "でんわ", "Telephone"], ["連絡", "れんらく", "Contact"], ["受け取る", "うけとる", "To receive"], ["はんこ", "はんこ", "Personal seal"], ["場合", "ばあい", "Case / situation"]], "kanji_used": [["日本", "にほん", "Japan"], ["宅配便", "たくはいびん", "Delivery service"], ["便利", "べんり", "Convenient"], ["荷物", "にもつ", "Package"], ["家", "いえ", "Home"], ["届ける", "とどける", "To deliver"], ["買い物", "かいもの", "Shopping"], ["商品", "しょうひん", "Product"], ["来る", "くる", "To come"], ["多い", "おおい", "Many"], ["不在票", "ふざいひょう", "Delivery notice"], ["入る", "はいる", "To enter"], ["番号", "ばんごう", "Number"], ["配達", "はいたつ", "Delivery"], ["会社", "かいしゃ", "Company"], ["名前", "なまえ", "Name"], ["書く", "かく", "To write"], ["一度", "いちど", "One time"], ["電話", "でんわ", "Telephone"], ["連絡", "れんらく", "Contact"], ["時間", "じかん", "Time"], ["決める", "きめる", "To decide"], ["受け取る", "うけとる", "To receive"], ["使う", "つかう", "To use"], ["場合", "ばあい", "Case"], ["生活", "せいかつ", "Life"]]}]}], "objectives": ["Recall 10 shopping vocabulary words in both directions (JP→EN and EN→JP).", "Read a full N4-level passage and answer comprehension questions without translating word-by-word."], "warmup": {"kind": "text", "text": "Name as many words as you can from last week's vocabulary topic before starting today's new set."}, "practice": {"kind": "vocab_match", "text": "Cover the English column and recall each word's meaning from the Japanese alone. Then cover the Japanese and go the other direction.", "items": [{"jp": "店", "kana": "みせ", "romaji": "Mise", "en": "Shop"}, {" k only at the English, and try to say (or write) the Japanese sentence from memory. Then check yourself.", "items": [{"jp": "雨(あめ)ですから、行(い)きません。", "romaji": "Ame desu kara, ikimasen.", "en": "Because it's raining, I won't go."}, {"jp": "熱(ねつ)があるので、休(やす)みます。", "romaji": "Netsu ga aru node, yasumimasu.", "en": "Because I have a fever, I'll take the day off."}]}, "homework": {"text": "Write five original sentences of your own using から／ので. They can be simple — the goal is retrieval, not complexity."}}, {"number": 86, "week": 22, "day": "Tuesday", "part": 3, "type": "grammar", "title": "kedo and noni -- \"but\" and \"even though\"", "note": "", "sections": [{"kind": "grammar", "items": [{"jp": "けど／のに", "reading": "kedo / noni", "meaning": "but... / even though... (unexpected result)", "register": "Contrast", "explanation": "けど is a soft, everyday \"but,\" not far from English usage. のに is stronger — it carries a note of surprise, disappointment, or complaint that the actual result didn't match what you'd naturally expect from the first clause.", "structure": "Sentence + けど、+ contrast　・　Sentence + のに、+ unexpected result", "examples": [{"jp": "行(い)きたいけど、お金(かね)が ありません。", "romaji": "Ikitai kedo, okane ga arimasen.", "en": "I want to go, but I don't have money."}, {"jp": "勉強(べんきょう)したのに、忘(わす)れました。", "romaji": "Benkyou shita noni, wasuremashita.", "en": "Even though I studied, I forgot."}]}]}], "objectives": ["Use けど／のに (kedo / noni) correctly in a full sentence."], "warmup": {"kind": "text", "text": "Before looking below, try to recall one example sentence from last session's grammar point and say it out loud."}, "practice": {"kind": "grammar_blank", "text": "Cover the Japanese column below. Look only at the English, and try to say (or write) the Japanese sentence from memory. Then check yourself.", "items": [{"jp": "行(い)きたいけど、お金(かね)が ありません。", "romaji": "Ikitai kedo, okane ga arimasen.", "en": "I want to go, but I don't have money."}, {"jp": "勉強(べんきょう)したのに、忘(わす)れました。", "romaji": "Benkyou shita noni, wasuremashita.", "en": "Even though I studied, I forgot."}]}, "homework": {"text": "Write five original sentences of your own using けど／のに. They can be simple — the goal is retrieval, not complexity."}}, {"number": 87, "week": 22, "day": "Wednesday", "part": 3, "type": "kanji", "title": "Kanji: Health & Medical Care", "note": "", "sections": [{"kind": "kanji", "chapter": "Chapter 13 – Health & Medical Care", "items": [{"kanji": "院", "onyomi": "イン", "kunyomi": "—", "meaning": "Institution"}, {"kanji": "医", "onyomi": "イ", "kunyomi": "—", "meaning": "Medical"}, {"kanji": "者", "onyomi": "シャ", "kunyomi": "もの", "meaning": "Person"}, {"kanji": "薬", "onyomi": "ヤク", "kunyomi": "くすり", "meaning": "Medicine"}, {"kanji": "手", "onyomi": "シュ", "kunyomi": "て", "meaning": "Hand"}, {"kanji": "足", "onyomi": "ソク", "kunyomi": "Foot,", "meaning": "Leg"}, {"kanji": "目", "onyomi": "モク", "kunyomi": "め", "meaning": "Eye"}, {"kanji": "耳", "onyomi": "ジ", "kunyomi": "みみ", "meaning": "Ear"}, {"kanji": "口", "onyomi": "コウ・ク", "kunyomi": "くち", "meaning": "Mouth, Opening"}, {"kanji": "鼻", "onyomi": "ビ", "kunyomi": "はな", "meaning": "Nose"}, {"kanji": "歯", "onyomi": "シ", "kunyomi": "は", "meaning": "Tooth"}, {"kanji": "痛", "onyomi": "ツウ", "kunyomi": "いた(い)", "meaning": "Pain"}, {"kanji": "熱", "onyomi": "ネツ", "kunyomi": "あつ(い)", "meaning": "Fever, Heat"}, {"kanji": "血", "onyomi": "ケツ", "kunyomi": "ち", "meaning": "Blood"}, {"kanji": "顔", "onyomi": "ガン", "kunyomi": "かお", "meaning": "Face"}]}], "objectives": ["Read and write 15 new kanji, and recognize their on'yomi and kun'yomi."], "warmup": {"kind": "text", "text": "Write yesterday's (or last kanji session's) kanji from memory before starting today's new characters."}, "practice": {"kind": "kanji_drill", "text": "Cover the readings and meaning. Look only at the kanji shape and try to recall both readings and the meaning.", "items": [{"kanji": "院", "onyomi": "イン", "kunyomi": "—", "meaning": "Institution"}, {"kanji": "医", "onyomi": " ecause I have a fever, I'll take the day off."}]}, {"jp": "けど／のに", "reading": "kedo / noni", "meaning": "but... / even though... (unexpected result)", "register": "Contrast", "explanation": "けど is a soft, everyday \"but,\" not far from English usage. のに is stronger — it carries a note of surprise, disappointment, or complaint that the actual result didn't match what you'd naturally expect from the first clause.", "structure": "Sentence + けど、+ contrast　・　Sentence + のに、+ unexpected result", "examples": [{"jp": "行(い)きたいけど、お金(かね)が ありません。", "romaji": "Ikitai kedo, okane ga arimasen.", "en": "I want to go, but I don't have money."}, {"jp": "勉強(べんきょう)したのに、忘(わす)れました。", "romaji": "Benkyou shita noni, wasuremashita.", "en": "Even though I studied, I forgot."}]}]}, {"kind": "reading", "items": [{"num": "4", "topic": "日本の ごみの 出し方（How to Throw Away Garbage in Japan）", "jp": "日本では、ごみの 出し方に ルールが あります。\n町や 市によって、ルールが 少し ちがいます。\nごみは、もえる ごみ、もえない ごみ、びん、かん、ペットボトルなどに 分けます。\nごみを 出す 日と 時間も 決まっています。\n朝の 決まった 時間までに、ごみを 出す ことが 多いです。\n夜に ごみを 出しては いけない 場所も あります。\nごみぶくろは、町や 市が 決めた ふくろを 使う ことがあります。\nルールを 守らない と、ごみを 持って行って もらえない ことも あります。\n分からない ときは、近所の 人や 市役所で 聞く と いいです。\n日本で 気持ちよく 生活する ために、ごみの 出し方を 覚える ことが 大切です。", "romaji": "Nihon de wa, gomi no dashikata ni ruuru ga arimasu.\nMachi ya shi ni yotte, ruuru ga sukoshi chigaimasu.\nGomi wa, moeru gomi, moenai gomi, bin, kan, petto botoru nado ni wakemasu.\nGomi o dasu hi to jikan mo kimatte imasu.\nAsa no kimatta jikan made ni, gomi o dasu koto ga ooi desu.\nYoru ni gomi o dashite wa ikenai basho mo arimasu.\nGomibukuro wa, machi ya shi ga kimeta fukuro o tsukau koto ga arimasu.\nRuuru o mamoranai to, gomi o motte itte moraenai koto mo arimasu.\nWakaranai toki wa, kinjo no hito ya shiyakusho de kiku to ii desu.\nNihon de kimochi yoku seikatsu suru tame ni, gomi no dashikata o oboeru koto ga taisetsu desu.", "en": "In Japan, there are rules for throwing away garbage.\nDepending on the town or city, the rules are a little different.\nGarbage is sepa essing and hearsay", "note": "", "sections": [{"kind": "grammar", "items": [{"jp": "そうです・らしいです・かもしれません", "reading": "-sou / rashii / kamoshiremasen", "meaning": "looks like.../heard that.../might be...", "register": "Conjecture & hearsay", "explanation": "These four convey different levels of certainty. そうです after a verb/adjective stem means \"looks like\" (visual impression); after a full plain sentence it instead means \"I heard that\" (hearsay — a different grammar pattern that happens to share the same word). らしいです means \"apparently/seems,\" usually from indirect evidence. かもしれません is the weakest guess — \"might.\"", "structure": "Stem + そうです (appearance)　・　Plain sentence + そうです (hearsay)　・　Plain + らしいです／かもしれません", "examples": [{"jp": "この ケーキ、おいしそうです。", "romaji": "Kono keeki, oishisou desu.", "en": "This cake looks delicious."}, {"jp": "明日(あした)は 雨(あめ)だそうです。", "romaji": "Ashita wa ame da sou desu.", "en": "I heard it will rain tomorrow."}, {"jp": "明日(あした)は 寒(さむ)いかもしれません。", "romaji": "Ashita wa samui kamoshiremasen.", "en": "It might be cold tomorrow."}]}]}], "objectives": ["Use そうです・らしいです・かもしれません (-sou / rashii / kamoshiremasen) correctly in a full sentence."], "warmup": {"kind": "text", "text": "Before looking below, try to recall one example sentence from last session's grammar point and say it out loud."}, "practice": {"kind": "grammar_blank", "text": "Cover the Japanese column below. Look only at the English, and try to say (or write) the Japanese sentence from memory. Then check yourself.", "items": [{"jp": "この ケーキ、おいしそうです。", "romaji": "Kono keeki, oishisou desu.", "en": "This cake looks delicious."}, {"jp": "明日(あした)は 雨(あめ)だそうです。", "romaji": "Ashita wa ame da sou desu.", "en": "I heard it will rain tomorrow."}]}, "homework": {"text": "Write five original sentences of your own using そうです・らしいです・かもしれません. They can be simple — the goal is retrieval, not complexity."}}, {"number": 91, "week": 23, "day": "Wednesday", "part": 3, "type": "kanji", "title": "Kanji: Time i": "緊張"}, {"en": "Lonely", "romaji": "sabishii", "kana": "さびしい", "kanji": "寂しい"}]}, {"kind": "reading", "items": [{"num": "7", "topic": "日本の レストラン（Japanese Restaurants）", "jp": "日本には、いろいろな レストランが あります。\nラーメン屋、すし屋、カレー屋、ファミリーレストランなどが 人気です。\n店に 入る とき、店員が「いらっしゃいませ」と 言います。\n一人で 食べる 人も 多いので、一人でも 入りやすい 店が たくさん あります。\nメニューを 見て、食べたい 料理を 選びます。\n水や お茶は 無料で 出る ことが 多いです。\n注文する ときは、「これを お願いします」と 言う と 便利です。\n食事が 終わったら、レジで お金を 払います。\n日本では、チップを 払う 必要は ありません。\n日本の レストランを 使う と、日本の 食べ物と マナーを 学ぶ ことが できます。", "romaji": "Nihon ni wa, iroiro na resutoran ga arimasu.\nRaamen-ya, sushi-ya, karee-ya, famirii resutoran nado ga ninki desu.\nMise ni hairu toki, ten’in ga “irasshaimase” to iimasu.\nHitori de taberu hito mo ooi node, hitori demo hairiyasui mise ga takusan arimasu.\nMenyuu o mite, tabetai ryouri o erabimasu.\nMizu ya ocha wa muryou de deru koto ga ooi desu.\nChuumon suru toki wa, “kore o onegai shimasu” to iu to benri desu.\nShokuji ga owattara, reji de okane o haraimasu.\nNihon de wa, chippu o harau hitsuyou wa arimasen.\nNihon no resutoran o tsukau to, Nihon no tabemono to manaa o manabu koto ga dekimasu.", "en": "There are many kinds of restaurants in Japan.\nRamen shops, sushi shops, curry shops, and family restaurants are popular.\nWhen you enter a shop, the staff says, “Welcome.”\nBecause many people eat alone, there are many shops that are easy to enter alone.\nYou look at the menu and choose the food you want to eat.\nWater and tea are often served for free.\nWhen ordering, it is convenient to say, “This, please.”\nWhen the meal is finished, you pay money at the register.\nIn Japan, you do not need to pay a tip.\nBy using Japanese restaurants, you can learn Japanese food and manners.", "vocab": [["レストラン", "レストラン", "Restaurant"], ["ラーメン屋", "ラーメンや", "Ramen shop"], ["すし屋", "すしや", "Sushi shop"], ["店", "みせ", "Shop"], ["店員", "てんいん", "Shop staff"], ["一人", "ひとり", "One person / alone"], ["食べる", "たべる", "To eat"], ["メニュー", "メニュー", "Menu"], ["料理", "りょうり", "Food / dish"], ["選ぶ", "えらぶ",  is interesting."}]}, "homework": {"text": "Write five original sentences of your own using でしょう／と思います. They can be simple — the goal is retrieval, not complexity."}}, {"number": 94, "week": 24, "day": "Tuesday", "part": 3, "type": "grammar", "title": "teitadakemasenka / temoraemasenka -- very polite requests", "note": "", "sections": [{"kind": "grammar", "items": [{"jp": "ていただけませんか／てもらえませんか", "reading": "-te itadakemasen ka / -te moraemasen ka", "meaning": "could you please...?", "register": "Very polite requests", "explanation": "These build on the giving/receiving verbs you already learned (もらう→もらえる \"can receive,\" いただく = humble \"receive\") wrapped in a negative question, which in Japanese politeness culture is gentler than a direct request. ていただけませんか is the more formal of the two — appropriate for a boss, a stranger, or a customer service situation; てもらえませんか is only slightly more casual.", "structure": "Verb-て + いただけませんか／もらえませんか", "examples": [{"jp": "もう一度(いちど) 説明(せつめい)していただけませんか。", "romaji": "Mou ichido setsumei shite itadakemasen ka.", "en": "Could you please explain once more?"}, {"jp": "写真(しゃしん)を 撮(と)ってもらえませんか。", "romaji": "Shashin o totte moraemasen ka.", "en": "Could you take a picture for me?"}]}]}], "objectives": ["Use ていただけませんか／てもらえませんか (-te itadakemasen ka / -te moraemasen ka) correctly in a full sentence."], "warmup": {"kind": "text", "text": "Before looking below, try to recall one example sentence from last session's grammar point and say it out loud."}, "practice": {"kind": "grammar_blank", "text": "Cover the Japanese column below. Look only at the English, and try to say (or write) the Japanese sentence from memory. Then check yourself.", "items": [{"jp": "もう一度(いちど) 説明(せつめい)していただけませんか。", "romaji": "Mou ichido setsumei shite itadakemasen ka.", "en": "Could you please explain once more?"}, {"jp": "写真(しゃしん)を 撮(と)ってもらえませんか。", "romaji": "Shashin o totte moraemasen ka.", "en": "Could you take a picture for me?"}]}, "homework": {"text": "Write five ori ウ", "kunyomi": "いそ(ぐ)", "meaning": "Hurry, Urgent"}, {"kanji": "特", "onyomi": "トク", "kunyomi": "—", "meaning": "Special"}, {"kanji": "注", "onyomi": "チュウ", "kunyomi": "そそ(ぐ)", "meaning": "Attention, Pour"}, {"kanji": "返", "onyomi": "ヘン", "kunyomi": "かえ(す)・", "meaning": "Return"}, {"kanji": "送", "onyomi": "ソウ", "kunyomi": "おく(る)", "meaning": "Send"}, {"kanji": "真", "onyomi": "シン", "kunyomi": "ま", "meaning": "True"}, {"kanji": "試", "onyomi": "シ", "kunyomi": "る)・ため", "meaning": "Try, Test"}]}, "homework": {"text": "Write each of today's 12 kanji ten times, saying its meaning and one reading aloud each time."}}, {"number": 96, "week": 24, "day": "Thursday", "part": 3, "type": "review", "title": "A polite phone call + reading practice", "note": "Requests + probability + opinion in one roleplay.", "sections": [{"kind": "grammar", "items": [{"jp": "でしょう／と思います", "reading": "deshou / to omoimasu", "meaning": "probably... / I think that...", "register": "Opinion & probability", "explanation": "でしょう softens a statement into a probable guess, often said with rising intonation to invite agreement. と思います directly reports your own opinion or belief — と marks the quoted thought, 思います is \"[I] think.\"", "structure": "Plain sentence + でしょう　・　Plain sentence + と思います", "examples": [{"jp": "明日(あした)は 晴(は)れるでしょう。", "romaji": "Ashita wa hareru deshou.", "en": "It will probably be sunny tomorrow."}, {"jp": "この 映画(えいが)は おもしろいと思(おも)います。", "romaji": "Kono eiga wa omoshiroi to omoimasu.", "en": "I think this movie is interesting."}]}, {"jp": "ていただけませんか／てもらえませんか", "reading": "-te itadakemasen ka / -te moraemasen ka", "meaning": "could you please...?", "register": "Very polite requests", "explanation": "These build on the giving/receiving verbs you already learned (もらう→もらえる \"can receive,\" いただく = humble \"receive\") wrapped in a negative question, which in Japanese politeness culture is gentler than a direct request. ていただけませんか is the more formal of the two — appropriate for a boss, a stranger, or a customer service situation; てもらえませんか is only slightly more casual.", "structure": "Verb-て + いただけませんか／もらえませんか", "examples": [{"jp": "もう一度(いちど) 説明(せつめい)していただけませんか。", "romaji": "Mou ichido setsumei shite itadakemasen ka.", "en": "Could you please explain once more?"}, {"jp": "写真(しゃしん)を 撮(と)ってもらえませんか。", "romaji": "Shashin o totte moraemasen ka.", "en": "Could you take a picture for me?"}]}]}, {"kind": "reading", "items": [{"num": "5", "topic": "日本の アルバイト（Part-time Jobs in Japan）", "jp": "日本では、学生や 外国人が アルバイトを する ことがあります。\nコンビニ、レストラン、工場、ホテルなどで 働く 人が 多いです。\nアルバイトを する 前に、仕事の 内容と 時間を よく 聞きます。\n日本の 仕事では、時間を 守る ことが とても 大切です。\n仕事に おくれそうな ときは、早く 会社や 店に 連絡します。\nあいさつも とても 大事です。\n朝は「おはようございます」、仕事が 終わる ときは「お先に 失礼します」と 言います。\n分からない ことが ある ときは、先輩や 店長に 聞きます。\n仕事中は、お客さんに ていねいな 言葉を 使います。\n日本で アルバイトを すると、仕事の ルールや 日本語を 学ぶ ことが できます。", "romaji": "Nihon de wa, gakusei ya gaikokujin ga arubaito o suru koto ga arimasu.\nKonbini, resutoran, koujou, hoteru nado de hataraku hito ga ooi desu.\nArubaito o suru mae ni, shigoto no naiyou to jikan o yoku kikimasu.\nNihon no shigoto de wa, jikan o mamoru koto ga totemo taisetsu desu.\nShigoto ni okuresou na toki wa, hayaku kaisha ya mise ni renraku shimasu.\nAisatsu mo totemo daiji desu.\nAsa wa “ohayou gozaimasu”, shigoto ga owaru toki wa “osaki ni shitsurei shimasu” to iimasu.\nWakaranai koto ga aru toki wa, senpai ya tenchou ni kikimasu.\nShigotochuu wa, okyakusan ni teinei na kotoba o tsukaimasu.\nNihon de arubaito o suru to, shigoto no ruuru ya Nihongo o manabu koto ga dekimasu.", "en": "In Japan, students and foreigners sometimes do part-time jobs.\nMany people work at convenience stores, restaurants, factories, hotels, and other places.\nBefore starting a part-time job, you should ask carefully about the job details and working hours.\nIn Japanese jobs, being on time is very important.\nWhen you think you may be late, contact the company or shop quickly.\nGreetings are also very important.\nIn the morning, say “Good morning,” and when leaving work, say “Excuse me for leaving before you.”\nWhen there is something you do not understand, ask a senior worker or store manager.\nDuring work, use polite language with customers.\nBy doing a part-time job in Japan, you can learn work rules and Japanese language.", "vocab": [["学生", "がくせい", "Student"], ["外国人", "がいこくじん", "Foreigner"], ["アルバイト", "アルバイト", "Part-time job"], ["工場", "こうじょう", "Factory"], ["働く", "はたらく", "To work"], ["仕事", "しごと", "Work / job"], ["内容", "ないよう", "Contents / details"], ["時間", "じかん", "Time"], ["守る", "まもる", "To keep / follow"], ["大切", "たいせつ", "Important"], ["連絡", "れんらく", "Contact"], ["あいさつ", "あいさつ", "Greeting"], ["大事", "だいじ", "Important"], ["終わる", "おわる", "To finish"], ["失礼します", "しつれいします", "Excuse me"], ["先輩", "せんぱい", "Senior worker"], ["店長", "てんちょう", "Store manager"], ["お客さん", "おきゃくさん", "Customer"], ["言葉", "ことば", "Words / language"], ["学ぶ", "まなぶ", "To learn"]], "kanji_used": [["日本", "にほん", "Japan"], ["学生", "がくせい", "Student"], ["外国人", "がいこくじん", "Foreigner"], ["工場", "こうじょう", "Factory"], ["働く", "はたらく", "To work"], ["人", "ひと", "Person"], ["多い", "おおい", "Many"], ["前", "まえ", "Before"], ["仕事", "しごと", "Work"], ["内容", "ないよう", "Contents / details"], ["時間", "じかん", "Time"], ["聞く", "きく", "To ask / listen"], ["守る", "まもる", "To keep / follow"], ["大切", "たいせつ", "Important"], ["早い", "はやい", "Early / fast"], ["会社", "かいしゃ", "Company"], ["店", "みせ", "Shop"], ["連絡", "れんらく", "Contact"], ["大事", "だいじ", "Important"], ["朝", "あさ", "Morning"], ["終わる", "おわる", "To finish"], ["言う", "いう", "To say"], ["分かる", "わかる", "To understand"], ["先輩", "せんぱい", "Senior"], ["店長", "てんちょう", "Store manager"], ["客", "きゃく", "Customer"], ["言葉", "ことば", "Words / language"], ["使う", "つかう", "To use"], ["日本語", "にほんご", "Japanese language"], ["学ぶ", "まなぶ", "To learn"]]}]}], "objectives": ["Use でしょう／と思います (deshou / to omoimasu) correctly in a full sentence.", "Use ていただけませんか／てもらえませんか (-te itadakemasen ka / -te moraemasen ka) correctly in a full sentence.", "Read a full N4-level passage and answer comprehension ques

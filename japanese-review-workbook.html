pt": "Fill in the blank: もう一度(いちど) 説明(せつめい)していただけませんか。　(Could you please explain once more?)", "options": ["より／ほうが (N4)", "でしょう／と思います", "ていただけませんか／てもらえませんか", "そうです・らしいです・かもしれません"], "answer": "ていただけませんか／てもらえませんか", "id": 6}, {"kind": "mc", "prompt": "What does 「夕」 mean?", "options": ["Night", "Hurry, Urgent", "Winter", "Evening"], "answer": "Evening", "id": 7}, {"kind": "mc", "prompt": "What does 「楽しい」 (tanoshii) mean?", "options": ["Sad", "Surprised", "Excited / fun", "Healthy"], "answer": "Excited / fun", "id": 8}, {"kind": "mc", "prompt": "What does 「真」 mean?", "options": ["Open", "Close", "Cold", "True"], "answer": "True", "id": 9}, {"kind": "mc", "prompt": "What does 「病気」 (byouki) mean?", "options": ["Sick", "Excited / fun", "Nervous", "Healthy"], "answer": "Sick", "id": 10}, {"kind": "mc", "prompt": "What does 「緊張」 (kinchou) mean?", "options": ["Sad", "Relieved", "Nervous", "Angry"], "answer": "Nervous", "id": 11}, {"kind": "mc", "prompt": "Fill in the blank: この ケーキ、おいしそうです。　(This cake looks delicious.)", "options": ["でしょう／と思います", "ていただけませんか／てもらえませんか", "より／ほうが (N4)", "そうです・らしいです・かもしれません"], "answer": "そうです・らしいです・かもしれません", "id": 12}, {"kind": "mc", "prompt": "Fill in the blank: 明日(あした)は 晴(は)れるでしょう。　(It will probably be sunny tomorrow.)", "options": ["より／ほうが (N4)", "ていただけませんか／てもらえませんか", "そうです・らしいです・かもしれません", "でしょう／と思います"], "answer": "でしょう／と思います", "id": 13}, {"kind": "mc", "prompt": "What does 「怒る」 (okoru) mean?", "options": ["Tired", "Happy", "Angry", "Relieved"], "answer": "Angry", "id": 14}, {"kind": "mc", "prompt": "What does 「嬉しい」 (ureshii) mean?", "options": ["Happy", "Lonely", "Nervous", "Relieved"], "answer": "Happy", "id": 15}, {"kind": "mc", "prompt": "What does 「退屈」 (taikutsu) mean?", "options": ["Tired", "Nervous", "Happy", "Bored"], "answer": "Bored", "id": 16}, {"kind": "mc", "prompt": "Fill in the blank: 車(くるま)は 電車(でんしゃ)ほど 速(はや)くないです。　(Cars aren't as fast as trains.)", "options": ["そうです・らしいです・かもしれません", "でしょう／と思います", "より／ほうが (N4)", "ていただけませんか／てもらえませんか"], "answer": "より／ほうが (N4)", "id": 17}, {"kind": "mc", "prompt": "What does 「毎」 mean?", "options": ["Begin", "Every", "Cold", "Hold, Carry"], "answer": "Every", "id": 18}]}}, {"number": 97, "week": 25, "day": "Monday", "part": 3, "type": "grammar", "title": "tameni and youni -- purpose", "note": "", "sections": [{"kind": "grammar", "items": [{"jp": "ために／ように", "reading": "tame ni / you ni", "meaning": "in order to... / so that...", "register": "Purpose", "explanation": "Both express purpose, but ために requires a verb the speaker can control (a willed action), while ように is used when the outcome isn't directly controllable — abilities, involuntary verbs, or someone else's actions: 忘れないように (so that I won't forget — forgetting isn't something you \"do\" on purpose, so ために would be wrong here).", "structure": "Verb-dictionary + ために　・　Verb (potential/negative/dictionary) + ように", "examples": [{"jp": "日本(にほん)で 働(はたら)くために、日本語(にほんご)を 勉強(べんきょう)しています。", "romaji": "Nihon de hataraku tame ni, nihongo o benkyou shite imasu.", "en": "I'm studying Japanese in order to work in Japan."}, {"jp": "忘(わす)れないように、メモします。", "romaji": "Wasurenai you ni, memo shimasu.", "en": "I take notes so that I won't forget."}]}]}], "objectives": ["Use ために／ように (tame ni / you ni) correctly in a full sentence."], "warmup": {"kind": "text", "text": "Before looking below, try to recall one example sentence from last session's grammar point and say it out loud."}, "practice": {"kind": "grammar_blank", "text": "Cover the Japanese column below. Look only at the English, and try to say (or write) the Japanese sentence from memory. Then check yourself.", "items": [{"jp": "日本(にほん)で 働(はたら)くために、日本語(にほんご)を 勉強(べんきょう)しています。", "romaji": "Nihon de hataraku tame ni, nihongo o benkyou shite imasu.", "en": "I'm studying Japanese in order to work in Japan."}, {"jp": "忘(わす)れないように、メモします。", "romaji": "Wasurenai you ni, memo shimasu.", "en": "I take notes so that I won't forget."}]}, "homework": {"text": "Write five original sentences of your own using ために／ように. They can be simple — the goal is retrieval, not complexity."}}, {"number": 98, "week": 25, "day": "Tuesday", "part": 3, "type": "grammar", "title": "shika-nai, hazu desu, to iu", "note": "Restriction, expectation, and naming.", "sections": [{"kind": "grammar", "items": [{"jp": "しか〜ない／はずです／という", "reading": "shika...nai / hazu desu / to iu", "meaning": "nothing but... / should be.../ called...", "register": "N4 mixed patterns", "explanation": "しか always pairs with a negative verb, and the whole phrase together means \"only\" with a slightly stronger, more limiting nuance than だけ — 千円しかありません (I have only 1,000 yen [and that's a problem]). はずです expresses a confident expectation based on evidence or logic, not a guess. という names or introduces something by its title: 富士山という山 (a mountain called Mt. Fuji).", "structure": "Noun + しか + negative verb　・　Plain sentence + はずです　・　Noun A + という + Noun B", "examples": [{"jp": "千円(せんえん)しか ありません。", "romaji": "Sen-en shika arimasen.", "en": "I have only 1,000 yen."}, {"jp": "彼(かれ)は 来(く)るはずです。", "romaji": "Kare wa kuru hazu desu.", "en": "He should be coming."}, {"jp": "富士山(ふじさん)という 山(やま)です。", "romaji": "Fujisan to iu yama desu.", "en": "It's a mountain called Mt. Fuji."}]}]}], "objectives": ["Use しか〜ない／はずです／という (shika...nai / hazu desu / to iu) correctly in a full sentence."], "warmup": {"kind": "text", "text": "Before looking below, try to recall one example sentence from last session's grammar point and say it out loud."}, "practice": {"kind": "grammar_blank", "text": "Cover the Japanese column below. Look only at the English, and try to say (or write) the Japanese sentence from memory. Then check yourself.", "items": [{"jp": "千円(せんえん)しか ありません。", "romaji": "Sen-en shika arimasen.", "en": "I have only 1,000 yen."}, {"jp": "彼(かれ)は 来(く)るはずです。", "romaji": "Kare wa kuru hazu desu.", "en": "He should be coming."}]}, "homework": {"text": "Write five original sentences of your own using しか〜ない／はずです／という. They can be simple — the goal is retrieval, not complexity."}}, {"number": 99, "week": 25, "day": "Wednesday", "part": 3, "type": "kanji", "title": "Kanji: Essential JLPT N4 kanji, part 2", "note": "", "sections": [{"kind": "kanji", "chapter": "Chapter 15 – Essential JLPT N4 Kanji", "items": [{"kanji": "験", "onyomi": "—", "kunyomi": "—", "meaning": "Examination"}, {"kanji": "問", "onyomi": "モン", "kunyomi": "と(う)", "meaning": "Question"}, {"kanji": "答", "onyomi": "トウ", "kunyomi": "こた(える)", "meaning": "Answer"}, {"kanji": "対", "onyomi": "タイ", "kunyomi": "—", "meaning": "Against, Pair"}, {"kanji": "決", "onyomi": "ケツ", "kunyomi": "き(める)", "meaning": "Decide"}, {"kanji": "定", "onyomi": "さだ(める)", "kunyomi": "Decide,", "meaning": "Fixed"}, {"kanji": "外", "onyomi": "ガイ・ゲ", "kunyomi": "—", "meaning": "Outside"}, {"kanji": "必", "onyomi": "ヒツ", "kunyomi": "かなら(ず)", "meaning": "Certainly, Must"}, {"kanji": "要", "onyomi": "ヨウ", "kunyomi": "い(る)", "meaning": "Need, Important"}, {"kanji": "束", "onyomi": "ソク", "kunyomi": "たば", "meaning": "Bundle"}, {"kanji": "準", "onyomi": "ジュン", "kunyomi": "—", "meaning": "Preparation, Standard"}, {"kanji": "備", "onyomi": "ビ", "kunyomi": "そな(える)", "meaning": "Prepare"}, {"kanji": "続", "onyomi": "ゾク", "kunyomi": "—", "meaning": "Continue"}]}], "objectives": ["Read and write 13 new kanji, and recognize their on'yomi and kun'yomi."], "warmup": {"kind": "text", "text": "Write yesterday's (or last kanji session's) kanji from memory before starting today's new characters."}, "practice": {"kind": "kanji_drill", "text": "Cover the readings and meaning. Look only at the kanji shape and try to recall both readings and the meaning.", "items": [{"kanji": "験", "onyomi": "—", "kunyomi": "—", "meaning": "Examination"}, {"kanji": "問", "onyomi": "モン", "kunyomi": "と(う)", "meaning": "Question"}, {"kanji": "答", "onyomi": "トウ", "kunyomi": "こた(える)", "meaning": "Answer"}, {"kanji": "対", "onyomi": "タイ", "kunyomi": "—", "meaning": "Against, Pair"}, {"kanji": "決", "onyomi": "ケツ", "kunyomi": "き(める)", "meaning": "Decide"}, {"kanji": "定", "onyomi": "さだ(める)", "kunyomi": "Decide,", "meaning": "Fixed"}, {"kanji": "外", "onyomi": "ガイ・ゲ", "kunyomi": "—", "meaning": "Outside"}, {"kanji": "必", "onyomi": "ヒツ", "kunyomi": "かなら(ず)", "meaning": "Certainly, Must"}, {"kanji": "要", "onyomi": "ヨウ", "kunyomi": "い(る)", "meaning": "Need, Important"}, {"kanji": "束", "onyomi": "ソク", "kunyomi": "たば", "meaning": "Bundle"}, {"kanji": "準", "onyomi": "ジュン", "kunyomi": "—", "meaning": "Preparation, Standard"}, {"kanji": "備", "onyomi": "ビ", "kunyomi": "そな(える)", "meaning": "Prepare"}, {"kanji": "続", "onyomi": "ゾク", "kunyomi": "—", "meaning": "Continue"}]}, "homework": {"text": "Write each of today's 13 kanji ten times, saying its meaning and one reading aloud each time."}}, {"number": 100, "week": 25, "day": "Thursday", "part": 3, "type": "grammar", "title": "temiru, teshimau, teoku, tearu", "note": "The four \"extra\" te-verbs.", "sections": [{"kind": "grammar", "items": [{"jp": "てみる・てしまう・ておく・てある", "reading": "-te miru / -te shimau / -te oku / -te aru", "meaning": "try doing / finish completely, unfortunately / do in advance / has been done", "register": "て-form extensions", "explanation": "Four more everyday て-form extensions. てみる = \"try doing [and see what happens].\" てしまう marks a completed action, often one with a regretful or irreversible feel (財布をなくしてしまいました = I went and lost my wallet). ておく = do something now in preparation for later. てある describes a resulting state someone deliberately set up (ドアが閉めてあります = the door has [been] closed [by someone, and remains so]).", "structure": "Verb-て + みる／しまう／おく／ある", "examples": [{"jp": "日本料理(にほんりょうり)を 食(た)べてみます。", "romaji": "Nihon ryouri o tabete mimasu.", "en": "I'll try eating Japanese food."}, {"jp": "財布(さいふ)を 忘(わす)れてしまいました。", "romaji": "Saifu o wasurete shimaimashita.", "en": "I (unfortunately) forgot my wallet."}, {"jp": "ホテルを 予約(よやく)しておきます。", "romaji": "Hoteru o yoyaku shite okimasu.", "en": "I'll book the hotel in advance."}, {"jp": "ドアが 閉(し)めてあります。", "romaji": "Doa ga shimete arimasu.", "en": "The door has been closed."}]}]}], "objectives": ["Use てみる・てしまう・ておく・てある (-te miru / -te shimau / -te oku / -te aru) correctly in a full sentence."], "warmup": {"kind": "text", "text": "Before looking below, try to recall one example sentence from last session's grammar point and say it out loud."}, "practice": {"kind": "grammar_blank", "text": "Cover the Japanese column below. Look only at the English, and try to say (or write) the Japanese sentence from memory. Then check yourself.", "items": [{"jp": "日本料理(にほんりょうり)を 食(た)べてみます。", "romaji": "Nihon ryouri o tabete mimasu.", "en": "I'll try eating Japanese food."}, {"jp": "財布(さいふ)を 忘(わす)れてしまいました。", "romaji": "Saifu o wasurete shimaimashita.", "en": "I (unfortunately) forgot my wallet."}]}, "homework": {"text": "Write five original sentences of your own using てみる・てしまう・ておく・てある. They can be simple — the goal is retrieval, not complexity."}}, {"number": 101, "week": 26, "day": "Monday", "part": 3, "type": "grammar", "title": "ba, tara, nara -- three ways to say \"if\"", "note": "The last major N4 structure.", "sections": [{"kind": "grammar", "items": [{"jp": "ば・たら・なら", "reading": "-ba / -tara / -nara", "meaning": "if / if / if (it's the case that)", "register": "Conditional forms", "explanation": "Three conditionals, three different feels. ば (change final u→e, add ば for verbs) is the most \"grammatical\" and general — good for hypotheticals and rules. たら (verb-た + ら) is the most flexible and common in speech — it works for both hypothetical and definite \"when/if\" situations, and the result often comes as a surprise. なら responds directly to something already mentioned — 日本なら行きたいです (if it's [specifically] Japan, I'd like to go) reacts to \"Japan\" having just come up.", "structure": "Verb-ば　・　Verb-た + ら　・　Noun/plain sentence + なら", "examples": [{"jp": "安(やす)ければ、買(か)います。", "romaji": "Yasukereba, kaimasu.", "en": "If it's cheap, I'll buy it."}, {"jp": "仕事(しごと)が 終(お)わったら、帰(かえ)ります。", "romaji": "Shigoto ga owattara, kaerimasu.", "en": "I'll go home when/if work finishes."}, {"jp": "日本(にほん)なら 行(い)きたいです。", "romaji": "Nihon nara ikitai desu.", "en": "If it's Japan, I'd like to go."}]}]}], "objectives": ["Use ば・たら・なら (-ba / -tara / -nara) correctly in a full sentence."], "warmup": {"kind": "text", "text": "Before looking below, try to recall one example sentence from last session's grammar point and say it out loud."}, "practice": {"kind": "grammar_blank", "text": "Cover the Japanese column below. Look only at the English, and try to say (or write) the Japanese sentence from memory. Then check yourself.", "items": [{"jp": "安(やす)ければ、買(か)います。", "romaji": "Yasukereba, kaimasu.", "en": "If it's cheap, I'll buy it."}, {"jp": "仕事(しごと)が 終(お)わったら、帰(かえ)ります。", "romaji": "Shigoto ga owattara, kaerimasu.", "en": "I'll go home when/if work finishes."}]}, "homework": {"text": "Write five original sentences of your own using ば・たら・なら. They can be simple — the goal is retrieval, not complexity."}}, {"number": 102, "week": 26, "day": "Tuesday", "part": 3, "type": "reading", "title": "Reading practice: parks and disaster preparedness", "note": "Cumulative reading using the last six months of vocabulary and grammar.", "sections": [{"kind": "reading", "items": [{"num": "8", "topic": "日本の こうえん（Japanese Parks）", "jp": "日本の 町には、こうえんが よく あります。\nこうえんは、子どもだけでなく、大人にも 人気の 場所です。\n朝、こうえんで さんぽを する 人が います。\n昼には、子どもが 友だちと 遊んでいます。\n春には、さくらを 見る ために 多くの 人が こうえんへ 行きます。\nベンチに 座って、おべんとうを 食べる 人も います。\nこうえんでは、ごみを 持って帰る ことが 大切です。\n大きな 声で さわいだり、花を とったり してはいけません。\n雨の あとは、地面が すべりやすいので 気を つけます。\n日本の こうえんは、休む ためにも、自然を 楽しむ ためにも よい 場所です。", "romaji": "Nihon no machi ni wa, kouen ga yoku arimasu.\nKouen wa, kodomo dake de naku, otona ni mo ninki no basho desu.\nAsa, kouen de sanpo o suru hito ga imasu.\nHiru ni wa, kodomo ga tomodachi to asonde imasu.\nHaru ni wa, sakura o miru tame ni ooku no hito ga kouen e ikimasu.\nBenchi ni suwatte, obentou o taberu hito mo imasu.\nKouen de wa, gomi o motte kaeru koto ga taisetsu desu.\nOokina koe de sawaidari, hana o tottari shite wa ikemasen.\nAme no ato wa, jimen ga suberiyasui node ki o tsukemasu.\nNihon no kouen wa, yasumu tame ni mo, shizen o tanoshimu tame ni mo yoi basho desu.", "en": "There are often parks in Japanese towns.\nParks are popular places not only for children but also for adults.\nIn the morning, some people take walks in parks.\nIn the afternoon, children play with friends.\nIn spring, many people go to parks to see cherry blossoms.\nSome people sit on benches and eat lunch boxes.\nIn parks, it is important to take your garbage home.\nYou must not make loud noise or pick flowers.\nAfter rain, the ground is slippery, so you should be careful.\nJapanese parks are good places to rest and enjoy nature.", "vocab": [["こうえん", "こうえん", "Park"], ["町", "まち", "Town"], ["子ども", "こども", "Child"], ["大人", "おとな", "Adult"], ["人気", "にんき", "Popular"], ["場所", "ばしょ", "Place"], ["朝", "あさ", "Morning"], ["さんぽ", "さんぽ", "Walk"], ["昼", "ひる", "Afternoon / noon"], ["友だち", "ともだち", "Friend"], ["遊ぶ", "あそぶ", "To play"], ["春", "はる", "Spring"], ["さくら", "さくら", "Cherry blossom"], ["座る", "すわる", "To sit"], ["花", "はな", "Flower"], ["地面", "じめん", "Ground"], ["自然", "しぜん", "Nature"], ["楽しむ", "たのしむ", "To enjoy"]], "kanji_used": [["日本", "にほん", "Japan"], ["町", "まち", "Town"], ["子ども", "こども", "Child"], ["大人", "おとな", "Adult"], ["人気", "にんき", "Popular"], ["場所", "ばしょ", "Place"], ["朝", "あさ", "Morning"], ["人", "ひと", "Person"], ["昼", "ひる", "Noon / daytime"], ["友だち", "ともだち", "Friend"], ["遊ぶ", "あそぶ", "To play"], ["春", "はる", "Spring"], ["見る", "みる", "To see"], ["多い", "おおい", "Many"], ["行く", "いく", "To go"], ["座る", "すわる", "To sit"], ["食べる", "たべる", "To eat"], ["持つ", "もつ", "To hold / carry"], ["帰る", "かえる", "To return"], ["大切", "たいせつ", "Important"], ["大きい", "おおきい", "Big"], ["声", "こえ", "Voice"], ["花", "はな", "Flower"], ["雨", "あめ", "Rain"], ["後", "あと", "After"], ["地面", "じめん", "Ground"], ["気", "き", "Spirit / care"], ["休む", "やすむ", "To rest"], ["自然", "しぜん", "Nature"], ["楽しむ", "たのしむ", "To enjoy"]]}, {"num": "10", "topic": "日本の 地震の そなえ（Preparing for Earthquakes in Japan）", "jp": "日本では、地震が 起こる ことが あります。\nそのため、地震の そなえを しておく ことが 大切です。\n家には、水、食べ物、ライト、電池などを 用意しておく と 安心です。\n大きな 地震の とき、電気や ガスが 止まる ことも あります。\nまた、電車が 止まって、家に 帰れない ことも あります。\n学校や 会社では、ひなん くんれんを する ことが あります。\n地震が 来た ときは、まず 頭を 守ります。\n机の 下に 入ったり、安全な 場所へ 行ったり します。\n外に いる ときは、建物や ガラスから はなれます。\n日本で 安全に 生活する ために、地震の とき 何を するか 知っておく ことが 必要です。", "romaji": "Nihon de wa, jishin ga okoru koto ga arimasu.\nSono tame, jishin no sonae o shite oku koto ga taisetsu desu.\nIe ni wa, mizu, tabemono, raito, denchi nado o youi shite oku to anshin desu.\nOokina jishin no toki, denki ya gasu ga tomaru koto mo arimasu.\nMata, densha ga tomatte, ie ni kaerenai koto mo arimasu.\nGakkou ya kaisha de wa, hinan kunren o suru koto ga arimasu.\nJishin ga kita toki wa, mazu atama o mamorimasu.\nTsukue no shita ni haittari, anzen na basho e ittari shimasu.\nSoto ni iru toki wa, tatemono ya garasu kara hanaremasu.\nNihon de anzen ni seikatsu suru tame ni, jishin no toki nani o suru ka shitte oku koto ga hitsuyou desu.", "en": "In Japan, earthquakes sometimes happen.\nFor that reason, it is important to prepare for earthquakes.\nAt home, it is reassuring to prepare water, food, lights, batteries, and other things.\nDuring a big earthquake, electricity and gas may stop.\nAlso, trains may stop, and you may not be able to return home.\nAt schools and companies, evacuation drills are sometimes held.\nWhen an earthquake comes, first protect your head.\nYou go under a desk or move to a safe place.\nWhen you are outside, move away from buildings and glass.\nTo live safely in Japan, it is necessary to know what to do during an earthquake.", "vocab": [["地震", "じしん", "Earthquake"], ["起こる", "おこる", "To happen"], ["そなえ", "そなえ", "Preparation"], ["大切", "たいせつ", "Important"], ["家", "いえ", "House / home"], ["水", "みず", "Water"], ["食べ物", "たべもの", "Food"], ["電池", "でんち", "Battery"], ["用意", "ようい", "Preparation"], ["安心", "あんしん", "Relief / safe feeling"], ["電気", "でんき", "Electricity"], ["ガス", "ガス", "Gas"], ["止まる", "とまる", "To stop"], ["帰る", "かえる", "To return"], ["ひなん", "ひなん", "Evacuation"], ["くんれん", "くんれん", "Training / drill"], ["頭", "あたま", "Head"], ["守る", "まもる", "To protect"], ["机", "つくえ", "Desk"], ["安全", "あんぜん", "Safety"], ["建物", "たてもの", "Building"], ["必要", "ひつよう", "Necessary"]], "kanji_used": [["日本", "にほん", "Japan"], ["地震", "じしん", "Earthquake"], ["起こる", "おこる", "To happen"], ["大切", "たいせつ", "Important"], ["家", "いえ", "House"], ["水", "みず", "Water"], ["食べ物", "たべもの", "Food"], ["電池", "でんち", "Battery"], ["用意", "ようい", "Preparation"], ["安心", "あんしん", "Relief"], ["大きい", "おおきい", "Big"], ["電気", "でんき", "Electricity"], ["止まる", "とまる", "To stop"], ["電車", "でんしゃ", "Train"], ["帰る", "かえる", "To return"], ["学校", "がっこう", "School"], ["会社", "かいしゃ", "Company"], ["来る", "くる", "To come"], ["頭", "あたま", "Head"], ["守る", "まもる", "To protect"], ["机", "つくえ", "Desk"], ["下", "した", "Under"], ["入る", "はいる", "To enter"], ["安全", "あんぜん", "Safety"], ["場所", "ばしょ", "Place"], ["行く", "いく", "To go"], ["外", "そと", "Outside"], ["建物", "たてもの", "Building"], ["何", "なに", "What"], ["知る", "しる", "To know"], ["必要", "ひつよう", "Necessary"], ["生活", "せいかつ", "Life"]]}]}], "objectives": ["Read a full N4-level passage and answer comprehension questions without translating word-by-word."], "warmup": {"kind": "text", "text": "Spend five minutes reviewing your notes from the last session before beginning today's material."}, "practice": {"kind": "text", "text": "Work through today's material twice: once reading along, once testing yourself with the Japanese covered."}, "homework": {"text": "Review today's material for ten minutes before your next session."}}, {"number": 103, "week": 26, "day": "Wednesday", "part": 3, "type": "review", "title": "Full-course review", "note": "Everything, revisited: kana, particles, verb forms, N4 patterns.", "sections": [], "objectives": ["Consolidate and review previously studied material."], "warmup": {"kind": "text", "t answer": "もんだい"}]}, {"heading": "Part 2 — Orthography: choose the correct kanji for the underlined word.", "questions": [{"prompt": "あした、かいしゃを＿やすみ＿ます。", "options": ["休み", "体み", "休美", "木み"], "answer": "休み"}, {"prompt": "でんしゃの＿じかん＿を調べます。", "options": ["時間", "持間", "時聞", "侍間"], "answer": "時間"}, {"prompt": "この＿かわ＿はとても長いです。", "options": ["川", "州", "山", "水"], "answer": "川"}, {"prompt": "毎朝、しんぶんを＿よみ＿ます。", "options": ["読み", "売み", "続み", "語み"], "answer": "読み"}, {"prompt": "駅までの＿みち＿を教えてください。", "options": ["道", "導", "通", "道路"], "answer": "道"}]}, {"heading": "Part 3 — Contextually-Defined Expressions: choose the word that best fits the sentence.", "questions": [{"prompt": "部屋が（　）ですから、窓を開けましょう。", "options": ["暑い", "静か", "便利", "大切"], "answer": "暑い"}, {"prompt": "電車が（　）ので、会社に遅れました。", "options": ["止まった", "起きた", "買った", "習った"], "answer": "止まった"}, {"prompt": "田中さんは仕事が（　）で、いつも忙しいです。", "options": ["たくさん", "少し", "ちょっと", "あまり"], "answer": "たくさん"}, {"prompt": "この漢字の（　）が分かりません。", "options": ["意味", "味", "気持ち", "天気"], "answer": "意味"}, {"prompt": "薬を飲んだら、頭が（　）なりました。", "options": ["楽に", "元気に", "忙しく", "有名に"], "answer": "楽に"}]}, {"heading": "Part 4 — Paraphrase: choose the sentence closest in meaning.", "questions": [{"prompt": "田中さんはとても親切です。", "options": ["田中さんはよく人を助けます。", "田中さんはよく怒ります。", "田中さんはよく忘れます。", "田中さんはよく休みます。"], "answer": "田中さんはよく人を助けます。"}, {"prompt": "会議は中止になりました。", "options": ["会議はありません。", "会議は始まりました。", "会議は長くなりました。", "会議は面白かったです。"], "answer": "会議はありません。"}, {"prompt": "彼はさっき出かけました。", "options": ["彼は少し前に外へ行きました。", "彼はまだ家にいます。", "彼は明日出かけます。", "彼はもう帰りました。"], "answer": "彼は少し前に外へ行きました。"}, {"prompt": "この仕事は簡単です。", "options": ["この仕事は易しいです。", "この仕事は難しいです。", "この仕事は高いです。", "この仕事は重いです。"], "answer": "この仕事は易しいです。"}, {"prompt": "田中さんは今、留守です。", "options": ["田中さんは今、家にいません。", "田中さんは今、忙しいです。", "田中さんは今、病気です。", "田中さんは今、寝ています。"], "answer": "田中さんは今、家にいません。"}]}]}, {"title": "Language Knowledge — Grammar & Reading", "time_minutes": 35, "instructions": "Grammar fill-in-the-blank, sentence composition, and reading comprehension — using the grammar points and reading passages from this course.", "groups": [{"heading": "Part 1 — Grammar: choose the best word for the blank.", "questions": [{"prompt": "明日、雨（　）降るかもしれません。", "options": ["が", "を", "に", "で"], "answer": "が"}, {"prompt": "疲れた（　）、少し休みましょう。", "options": ["ので", "のに", "けど", "しか"], "answer": "ので"}, {"prompt": "日本語が話せる（　）なりました。", "options": ["ように", "ために", "ばかり", "だけ"], "answer": "ように"}, {"prompt": "駅まで歩いて 5分（　）かかります。", "options": ["ぐらい", "しか", "まで", "ほど"], "answer": "ぐらい"}, {"prompt": "この本は面白い（　）、少し難しいです。", "options": ["ですが", "ですから", "でしたら", "でしょう"], "answer": "ですが"}, {"prompt": "田中さんに漢字を教えて（　）ました。", "options": ["もらい", "あげ", "くれ", "やり"], "answer": "もらい"}, {"prompt": "安い（　）、買います。", "options": ["ければ", "なら", "たら", "ても"], "answer": "ければ"}, {"prompt": "約束の時間（　）に来てください。", "options": ["までに", "まで", "から", "より"], "answer": "までに"}, {"prompt": "田中さんは来る（　）です。もう出発したと聞きました。", "options": ["はず", "つもり", "よう", "そう"], "answer": "はず"}, {"prompt": "写真を撮っても（　）ですか。", "options": ["いい", "よく", "いく", "ある"], "answer": "いい"}]}, {"heading": "Part 2 — Sentence Composition: four numbered pieces form one natural sentence when placed in order into the four blanks. Choose which piece number belongs at the ★.", "questions": [{"prompt": "Pieces: 1.食べます　2.手を　3.洗ってから　4.いつも\nPattern: ＿＿　＿＿　★　＿＿　。", "options": ["1", "2", "3", "4"], "answer": "3", "note": "Correct order: 4→2→3→1 — \"いつも 手を 洗ってから 食べます。\" (I always eat after washing my hands.) The star (3rd slot) is piece 3."}, {"prompt": "Pieces: 1.買います　2.安ければ　3.この店で　4.くつを\nPattern: ＿＿　＿＿　★　＿＿　。", "options": ["1", "2", "3", "4"], "answer": "4", "note": "Correct order: 2→3→4→1 — \"安ければ この店で くつを 買います。\" (If it's cheap, I'll buy shoes at this store.) The star (3rd slot) is piece 4."}, {"prompt": "Pieces: 1.あります　2.日本へ　3.行ったことが　4.一度だけ\nPattern: ＿＿　＿＿　★　＿＿　。", "options": ["1", "2", "3", "4"], "answer": "3", "note": "Correct order: 4→2→3→1 — \"一度だけ 日本へ 行ったことが あります。\" (I have been to Japan only once.) The star (3rd slot) is piece 3."}]}, {"heading": "Part 3 — Reading Comprehension: read the passage and answer the questions.", "reading_ref": 3, "questions": [{"prompt": "この文章によると、病院へ行く前に何を持っていきますか。", "options": ["健康保険証", "パスポート", "学生証", "クレジットカード"], "answer": "健康保険証"}, {"prompt": "受付で何を伝えますか。", "options": ["症状", "名前だけ", "趣味", "仕事"], "answer": "症状"}, {"prompt": "薬をもらうために、どこへ行くことがありますか。", "options": ["薬局", "コンビニ", "スーパー", "駅"], "answer": "薬局"}]}, {"heading": "Part 3 (continued) — a second passage.", "reading_ref": 9, "questions": [{"prompt": "宅配便の再配達をお願いするとき、何をしますか。", "options": ["連絡する", "荷物を送り返す", "店に行く", "手紙を書く"], "answer": "連絡する"}, {"prompt": "この文章のテーマは何ですか。", "options": ["日本の宅配便サービス", "日本の学校", "日本の天気", "日本のレストラン"], "answer": "日本の宅配便サービス"}]}]}, {"title": "Listening", "time_minutes": 20, "instructions": "Each question plays once (or more, if you replay it) through your browser's built-in Japanese text-to-speech. Listen, then choose the best answer. Use the 🔊 button to play or replay the audio.", "groups": [{"heading": "Part 1 — Quick Response: listen to the question or remark, then choose the best reply.", "questions": [{"audio": "すみません、今何時ですか。", "prompt": "What is the best reply?", "options": ["3時半です。", "駅にあります。", "学生です。", "おいしいです。"], "answer": "3時半です。"}, {"audio": "写真を撮ってもいいですか。", "prompt": "What is the best reply?", "options": ["はい、どうぞ。", "はい、行きます。", "いいえ、遠いです。", "いいえ、忙しいです。"], "answer": "はい、どうぞ。"}, {"audio": "すみません、この漢字の読み方が分かりません。", "prompt": "What is the best reply?", "options": ["一緒に調べましょう。", "おいしいですね。", "駅まで行きましょう。", "元気ですか。"], "answer": "一緒に調べましょう。"}, {"audio": "週末、何をしますか。", "prompt": "What is the best reply?", "options": ["友達と映画を見ます。", "駅から近いです。", "日本語を教えています。", "あまり好きじゃないです。"], "answer": "友達と映画を見ます。"}, {"audio": "あのう、駅までどう行けばいいですか。", "prompt": "What is the best reply?", "options": ["まっすぐ行って、右に曲がってください。", "5時に行きます。", "駅はとても新しいです。", "2時間かかりました。"], "answer": "まっすぐ行って、右に曲がってください。"}]}, {"heading": "Part 2 — Short Conversations: listen to the short exchange, then answer the question.", "questions": [{"audio": "女：明日、いっしょに図書館へ行きませんか。男：すみません、明日は病院へ行かなければなりません。", "prompt": "Why can't the man go to the library tomorrow?", "options": ["He has to go to the hospital.", "He has to work.", "He is going to Japan.", "He is tired."], "answer": "He has to go to the hospital."}, {"audio": "男：この仕事、いつまでに終わらせればいいですか。女：来週の月曜日までにお願いします。", "prompt": "When is the deadline?", "options": ["Next Monday", "Next Friday", "Tomorrow", "Next month"], "answer": "Next Monday"}, {"audio": "女：田中さん、電車が止まっているそうです。男：じゃあ、バスで行きましょう。", "prompt": "How will they travel now?", "options": ["By bus", "By train", "By car", "On foot"], "answer": "By bus"}, {"audio": "男：すみません、これより安いのはありますか。店員：はい、こちらはいかがですか。", "prompt": "What is the customer asking for?", "options": ["A cheaper item", "A bigger item", "A different color", "A refund"], "answer": "A cheaper item"}, {"audio": "女：頭が痛いし、熱もあるんです。男：それは大変ですね。早く病院へ行ったほうがいいですよ。", "prompt": "What does the man suggest?", "options": ["Going to the hospital soon", "Taking a rest at home", "Drinking more water", "Calling a friend"], "answer": "Going to the hospital soon"}]}, {"heading": "Part 3 — Passage Listening: listen to the short announcement or story, then answer.", "questions": [{"audio": "お知らせします。本日、3番線の電車は事故のため、20分ほど遅れています。ご迷惑をおかけして申し訳ございません。", "prompt": "What is being announced?", "options": ["A train delay due to an accident", "A train schedule change for tomorrow", "A ticket price increase", "A station closing early"], "answer": "A train delay due to an accident"}, {"audio": "田中さんは去年、日本語の勉強を始めました。毎日30分ぐらい勉強して、今はニュースが少し分かるようになりました。", "prompt": "What has Tanaka become able to do?", "options": ["Understand a little of the news", "Speak perfect Japanese", "Teach Japanese", "Read a Japanese novel"], "answer": "Understand a little of the news"}]}]}], "scoring_note": "This is a practice tool, not an official scoring simulation. The real JLPT N4 has separate pass/fail thresholds per section as well as an overall minimum; here, aim for 70% or higher in each section as a healthy readiness signal."}, "reading_passages": [{"num": "1", "topic": "日本の 電車（Japanese Trains）", "jp": "日本の 電車は とても べんりで、時間に せいかくです。\n多くの 人が 毎日 電車を 使って、学校や 会社へ 行きます。\n朝と 夕方は 電車の 中が とても こみます。\n駅には きっぷを 買う きかいが あります。\nさいきんは、ICカードを 使う 人が 多いです。\n電車に 乗る 前に、行き先と ホームを よく 見ます。\n日本では、電車の 中で 大きな 声で 話さない ほうが いいです。\n電話を 使う ときも、まわりの 人に 気を つけます。\n電車を まちがえた ときは、駅の 人に 聞く ことが できます。\n日本で 生活する 人に とって、電車の 使い方を 知る ことは とても 大切です。", "romaji": "Nihon no densha wa totemo benri de, jikan ni seikaku desu.\nOokuno hito ga mainichi densha o tsukatte, gakkou ya kaisha e ikimasu.\nAsa to yuugata wa densha no naka ga totemo komimasu.\nEki ni wa kippu o kau kikai ga arimasu.\nSaikin wa, IC kaado o tsukau hito ga ooi desu.\nDensha ni noru mae ni, ikisaki to hoomu o yoku mimasu.\nNihon de wa, densha no naka de ookina koe de hanasanai hou ga ii desu.\nDenwa o tsukau toki mo, mawari no hito ni ki o tsukemasu.\nDensha o machigaeta toki wa, eki no hito ni kiku koto ga dekimasu.\nNihon de seikatsu suru hito ni totte, densha no tsukaikata o shiru koto wa totemo taisetsu desu.", "en": "Japanese trains are very convenient and punctual.\nMany people use trains every day to go to school or work.\nIn the morning and evening, trains become very crowded.\nAt stations, there are machines to buy tickets.\nRecently, many people use IC cards.\nBefore getting on a train, you should check the destination and platform carefully.\nIn Japan, it is better not to speak loudly inside the train.\nWhen using a phone, you should also be careful of people around you.\nIf you take the wrong train, you can ask station staff.\nFor people living in Japan, knowing how to use trains is very important.", "vocab": [["電車", "でんしゃ", "Train"], ["時間", "じかん", "Time"], ["せいかく", "せいかく", "Accurate / punctual"], ["毎日", "まいにち", "Every day"], ["学校", "がっこう", "School"], ["会社", "かいしゃ", "Company"], ["朝", "あさ", "Morning"], ["夕方", "ゆうがた", "Evening"], ["駅", "えき", "Station"], ["きっぷ", "きっぷ", "Ticket"], ["ICカード", "アイシーカード", "IC card"], ["行き先", "いきさき", "Destination"], ["ホーム", "ホーム", "Platform"], ["電話", "でんわ", "Telephone"], ["生活", "せいかつ", "Life / daily living"]], "kanji_used": [["日本", "にほん", "Japan"], ["電車", "でんしゃ", "Train"], ["時間", "じかん", "Time"], ["多い", "おおい", "Many"], ["人", "ひと", "Person"], ["毎日", "まいにち", "Every day"], ["学校", "がっこう", "School"], ["会社", "かいしゃ", "Company"], ["行く", "いく", "To go"], ["朝", "あさ", "Morning"], ["夕方", "ゆうがた", "Evening"], ["中", "なか", "Inside"], ["駅", "えき", "Station"], ["買う", "かう", "To buy"], ["使う", "つかう", "To use"], ["見る", "みる", "To see"], ["大きい", "おおきい", "Big"], ["声", "こえ", "Voice"], ["話す", "はなす", "To speak"], ["聞く", "きく", "To ask / listen"], ["知る", "しる", "To know"], ["大切", "たいせつ", "Important"]]}, {"num": "2", "topic": "日本の スーパー（Japanese Supermarkets）", "jp": "日本の スーパーでは、食べ物や 生活に 必要な 物を 買う ことが できます。\n野菜、肉、魚、たまご、牛乳などが 売っています。\n夕方に なると、べんとうや おそうざいが 安く なる ことが あります。\n仕事の あとで スーパーへ 行く 人も 多いです。\n日本の スーパーでは、商品が とても きれいに ならべて あります。\n店の 中には、肉の ばしょ、魚の ばしょ、パンの ばしょが あります。\n買い物を する 前に、何を 買うか メモを 作ると べんりです。\nレジでは、自分で お金を 入れる きかいも あります。\nふくろが 必要な ときは、店の 人に 言います。\n日本で 生活する とき、スーパーの 使い方を 知っていると とても 役に 立ちます。", "romaji": "Nihon no suupaa de wa, tabemono ya seikatsu ni hitsuyou na mono o kau koto ga dekimasu.\nYasai, niku, sakana, tamago, gyuunyuu nado ga utte imasu.\nYuugata ni naru to, bentou ya osouzai ga yasuku naru koto ga arimasu.\nShigoto no ato de suupaa e iku hito mo ooi desu.\nNihon no suupaa de wa, shouhin ga totemo kirei ni narabete arimasu.\nMise no naka ni wa, niku no basho, sakana no basho, pan no basho ga arimasu.\nKaimono o suru mae ni, nani o kau ka memo o tsukuru to benri desu.\nReji de wa, jibun de okane o ireru kikai mo arimasu.\nFukuro ga hitsuyou na toki wa, mise no hito ni iimasu.\nNihon de seikatsu suru toki, suupaa no tsukaikata o shitte iru to totemo yaku ni tachimasu.", "en": "At Japanese supermarkets, you can buy food and things necessary for daily life.\nVegetables, meat, fish, eggs, milk, and other items are sold there.\nIn the evening, lunch boxes and prepared foods sometimes become cheaper.\nMany people go to the supermarket after work.\nIn Japanese supermarkets, products are arranged very neatly.\nInside the store, there are areas for meat, fish, and bread.\nBefore shopping, it is convenient to make a memo of what to buy.\nAt the register, there are also machines where you put in money by yourself.\nWhen you need a bag, you tell the store staff.\nWhen living in Japan, knowing how to use supermarkets is very useful.", "vocab": [["スーパー", "スーパー", "Supermarket"], ["食べ物", "たべもの", "Food"], ["生活", "せいかつ", "Daily life"], ["必要", "ひつよう", "Necessary"], ["物", "もの", "Thing"], ["野菜", "やさい", "Vegetables"], ["肉", "にく", "Meat"], ["魚", "さかな", "Fish"], ["牛乳", "ぎゅうにゅう", "Milk"], ["売っています", "うっています", "Is sold"], ["安い", "やすい", "Cheap"], ["仕事", "しごと", "Work"], ["商品", "しょうひん", "Product"], ["買い物", "かいもの", "Shopping"], ["レジ", "レジ", "Cash register"], ["お金", "おかね", "Money"], ["ふくろ", "ふくろ", "Bag"], ["役に立つ", "やくにたつ", "Useful"]], "kanji_used": [["日本", "にほん", "Japan"], ["食べ物", "たべもの", "Food"], ["生活", "せいかつ", "Life"], ["必要", "ひつよう", "Necessary"], ["物", "もの", "Thing"], ["買う", "かう", "To buy"], ["野菜", "やさい", "Vegetables"], ["肉", "にく", "Meat"], ["魚", "さかな", "Fish"], ["牛乳", "ぎゅうにゅう", "Milk"], ["売る", "うる", "To sell"], ["夕方", "ゆうがた", "Evening"], ["安い", "やすい", "Cheap"], ["仕事", "しごと", "Work"], ["多い", "おおい", "Many"], ["商品", "しょうひん", "Product"], ["店", "みせ", "Shop"], ["中", "なか", "Inside"], ["何", "なに", "What"], ["作る", "つくる", "To make"], ["自分", "じぶん", "Oneself"], ["お金", "おかね", "Money"], ["言う", "いう", "To say"], ["知る", "しる", "To know"], ["役", "やく", "Use / role"], ["立つ", "たつ", "To stand"]]}, {"num": "3", "topic": "日本の 病院（Japanese Hospitals）", "jp": "日本で 病気に なった ときは、病院へ 行きます。\nかぜを ひいた ときや、熱が ある ときも、病院で 診てもらう ことが できます。\n病院へ 行く 前に、健康保険証を 持って 行きます。\nはじめての 病院では、名前、住所、電話番号を 書く ことが あります。\n受付の 人に 症状を かんたんに 伝えます。\nたとえば、「頭が 痛いです」や「おなかが 痛いです」と 言います。\n先生は いろいろな 質問を します。\nそのあと、薬を もらう ために 薬局へ 行く ことも あります。\n薬の 飲み方を よく 読んで、正しく 飲む ことが 大切です。\n日本で 安心して 生活する ために、病院の 使い方を 知っておきましょう。", "romaji": "Nihon de byouki ni natta toki wa, byouin e ikimasu.\nKaze o hiita toki ya, netsu ga aru toki mo, byouin de mite morau koto ga dekimasu.\nByouin e iku mae ni, kenkou hokenshou o motte ikimasu.\nHajimete no byouin de wa, namae, juusho, denwa bangou o kaku koto ga arimasu.\nUketsuke no hito ni shoujou o kantan ni tsutaemasu.\nTatoeba, “atama ga itai desu” ya “onaka ga itai desu” to iimasu.\nSensei wa iroiro na shitsumon o shimasu.\nSono ato, kusuri o morau tame ni yakkyoku e iku koto mo arimasu.\nKusuri no nomikata o yoku yonde, tadashiku nomu koto ga taisetsu desu.\nNihon de anshin shite seikatsu suru tame ni, byouin no tsukaikata o shitte okimashou.", "en": "When you get sick in Japan, you go to a hospital or clinic.\nWhen you catch a cold or have a fever, you can also be examined at a hospital.\nBefore going to the hospital, you take your health insurance card with you.\nAt a hospital you visit for the first time, you may write your name, address, and phone number.\nYou tell the receptionist your symptoms simply.\nFor example, you say, “I have a headache” or “My stomach hurts.”\nThe doctor asks various questions.\nAfter that, you may go to a pharmacy to get medicine.\nIt is important to read how to take the medicine and take it correctly.\nTo live safely in Japan, let’s know how to use hospitals.", "vocab": [["病気", "びょうき", "Illness"], ["病院", "びょういん", "Hospital / clinic"], ["かぜ", "かぜ", "Cold"], ["熱", "ねつ", "Fever"], ["健康保険証", "けんこうほけんしょう", "Health insurance card"], ["名前", "なまえ", "Name"], ["住所", "じゅうしょ", "Address"], ["電話番号", "でんわばんごう", "Phone number"], ["受付", "うけつけ", "Reception"], ["症状", "しょうじょう", "Symptoms"], ["頭", "あたま", "Head"], ["痛い", "いたい", "Painful"], ["先生", "せんせい", "Doctor / teacher"], ["質問", "しつもん", "Question"], ["薬", "くすり", "Medicine"], ["薬局", "やっきょく", "Pharmacy"], ["飲み方", "のみかた", "How to take / drink"], ["正しい", "ただしい", "Correct"]], "kanji_used": [["日本", "にほん", "Japan"], ["病気", "びょうき", "Illness"], ["病院", "びょういん", "Hospital"], ["行く", "いく", "To go"], ["熱", "ねつ", "Fever"], ["診る", "みる", "To examine"], ["前", "まえ", "Before"], ["健康", "けんこう", "Health"], ["保険証", "ほけんしょう", "Insurance card"], ["持つ", "もつ", "To carry"], ["名前", "なまえ", "Name"], ["住所", "じゅうしょ", "Address"], ["電話番号", "でんわばんごう", "Phone number"], ["書く", "かく", "To write"], ["受付", "うけつけ", "Reception"], ["人", "ひと", "Person"], ["症状", "しょうじょう", "Symptom"], ["頭", "あたま", "Head"], ["痛い", "いたい", "Painful"], ["言う", "いう", "To say"], ["先生", "せんせい", "Doctor / teacher"], ["質問", "しつもん", "Question"], ["薬", "くすり", "Medicine"], ["読む", "よむ", "To read"], ["正しい", "ただしい", "Correct"], ["大切", "たいせつ", "Important"], ["生活", "せいかつ", "Life"], ["知る", "しる", "To know"]]}, {"num": "4", "topic": "日本の ごみの 出し方（How to Throw Away Garbage in Japan）", "jp": "日本では、ごみの 出し方に ルールが あります。\n町や 市によって、ルールが 少し ちがいます。\nごみは、もえる ごみ、もえない ごみ、びん、かん、ペットボトルなどに 分けます。\nごみを 出す 日と 時間も 決まっています。\n朝の 決まった 時間までに、ごみを 出す ことが 多いです。\n夜に ごみを 出しては いけない 場所も あります。\nごみぶくろは、町や 市が 決めた ふくろを 使う ことがあります。\nルールを 守らない と、ごみを 持って行って もらえない ことも あります。\n分からない ときは、近所の 人や 市役所で 聞く と いいです。\n日本で 気持ちよく 生活する ために、ごみの 出し方を 覚える ことが 大切です。", "romaji": "Nihon de wa, gomi no dashikata ni ruuru ga arimasu.\nMachi ya shi ni yotte, ruuru ga sukoshi chigaimasu.\nGomi wa, moeru gomi, moenai gomi, bin, kan, petto botoru nado ni wakemasu.\nGomi o dasu hi to jikan mo kimatte imasu.\nAsa no kimatta jikan made ni, gomi o dasu koto ga ooi desu.\nYoru ni gomi o dashite wa ikenai basho mo arimasu.\nGomibukuro wa, machi ya shi ga kimeta fukuro o tsukau koto ga arimasu.\nRuuru o mamoranai to, gomi o motte itte moraenai koto mo arimasu.\nWakaranai toki wa, kinjo no hito ya shiyakusho de kiku to ii desu.\nNihon de kimochi yoku seikatsu suru tame ni, gomi no dashikata o oboeru koto ga taisetsu desu.", "en": "In Japan, there are rules for throwing away garbage.\nDepending on the town or city, the rules are a little different.\nGarbage is separated into burnable garbage, non-burnable garbage, bottles, cans, plastic bottles, and so on.\nThe day and time to put out garbage are also decided.\nOften, garbage is put out by a fixed time in the morning.\nThere are also places where you must not put out garbage at night.\nSometimes you must use garbage bags decided by the town or city.\nIf you do not follow the rules, your garbage may not be collected.\nWhen you do not understand, it is good to ask neighbors or the city office.\nTo live comfortably in Japan, it is important to remember how to throw away garbage.", "vocab": [["ごみ", "ごみ", "Garbage"], ["出し方", "だしかた", "How to put out"], ["ルール", "ルール", "Rule"], ["町", "まち", "Town"], ["市", "し", "City"], ["少し", "すこし", "A little"], ["もえる ごみ", "もえる ごみ", "Burnable garbage"], ["もえない ごみ", "もえない ごみ", "Non-burnable garbage"], ["びん", "びん", "Bottle"], ["かん", "かん", "Can"], ["ペットボトル", "ペットボトル", "Plastic bottle"], ["分ける", "わける", "To separate"], ["決まる", "きまる", "To be decided"], ["場所", "ばしょ", "Place"], ["守る", "まもる", "To follow / protect"], ["近所", "きんじょ", "Neighborhood"], ["市役所", "しやくしょ", "City office"], ["覚える", "おぼえる", "To remember"]], "kanji_used": [["日本", "にほん", "Japan"], ["出す", "だす", "To put out"], ["町", "まち", "Town"], ["市", "し", "City"], ["少し", "すこし", "A little"], ["分ける", "わける", "To separate"], ["日", "ひ", "Day"], ["時間", "じかん", "Time"], ["決まる", "きまる", "To be decided"], ["朝", "あさ", "Morning"], ["多い", "おおい", "Many"], ["夜", "よる", "Night"], ["場所", "ばしょ", "Place"], ["使う", "つかう", "To use"], ["守る", "まもる", "To follow / protect"], ["持つ", "もつ", "To hold / carry"], ["行く", "いく", "To go"], ["分かる", "わかる", "To understand"], ["近所", "きんじょ", "Neighborhood"], ["人", "ひと", "Person"], ["市役所", "しやくしょ", "City office"], ["聞く", "きく", "To ask"], ["気持ち", "きもち", "Feeling"], ["生活", "せいかつ", "Life"], ["覚える", "おぼえる", "To remember"], ["大切", "たいせつ", "Important"]]}, {"num": "5", "topic": "日本の アルバイト（Part-time Jobs in Japan）", "jp": "日本では、学生や 外国人が アルバイトを する ことがあります。\nコンビニ、レストラン、工場、ホテルなどで 働く 人が 多いです。\nアルバイトを する 前に、仕事の 内容と 時間を よく 聞きます。\n日本の 仕事では、時間を 守る ことが とても 大切です。\n仕事に おくれそうな ときは、早く 会社や 店に 連絡します。\nあいさつも とても 大事です。\n朝は「おはようございます」、仕事が 終わる ときは「お先に 失礼します」と 言います。\n分からない ことが ある ときは、先輩や 店長に 聞きます。\n仕事中は、お客さんに ていねいな 言葉を 使います。\n日本で アルバイトを すると、仕事の ルールや 日本語を 学ぶ ことが できます。", "romaji": "Nihon de wa, gakusei ya gaikokujin ga arubaito o suru koto ga arimasu.\nKonbini, resutoran, koujou, hoteru nado de hataraku hito ga ooi desu.\nArubaito o suru mae ni, shigoto no naiyou to jikan o yoku kikimasu.\nNihon no shigoto de wa, jikan o mamoru koto ga totemo taisetsu desu.\nShigoto ni okuresou na toki wa, hayaku kaisha ya mise ni renraku shimasu.\nAisatsu mo totemo daiji desu.\nAsa wa “ohayou gozaimasu”, shigoto ga owaru toki wa “osaki ni shitsurei shimasu” to iimasu.\nWakaranai koto ga aru toki wa, senpai ya tenchou ni kikimasu.\nShigotochuu wa, okyakusan ni teinei na kotoba o tsukaimasu.\nNihon de arubaito o suru to, shigoto no ruuru ya Nihongo o manabu koto ga dekimasu.", "en": "In Japan, students and foreigners sometimes do part-time jobs.\nMany people work at convenience stores, restaurants, factories, hotels, and other places.\nBefore starting a part-time job, you should ask carefully about the job details and working hours.\nIn Japanese jobs, being on time is very important.\nWhen you think you may be late, contact the company or shop quickly.\nGreetings are also very important.\nIn the morning, say “Good morning,” and when leaving work, say “Excuse me for leaving before you.”\nWhen there is something you do not understand, ask a senior worker or store manager.\nDuring work, use polite language with customers.\nBy doing a part-time job in Japan, you can learn work rules and Japanese language.", "vocab": [["学生", "がくせい", "Student"], ["外国人", "がいこくじん", "Foreigner"], ["アルバイト", "アルバイト", "Part-time job"], ["工場", "こうじょう", "Factory"], ["働く", "はたらく", "To work"], ["仕事", "しごと", "Work / job"], ["内容", "ないよう", "Contents / details"], ["時間", "じかん", "Time"], ["守る", "まもる", "To keep / follow"], ["大切", "たいせつ", "Important"], ["連絡", "れんらく", "Contact"], ["あいさつ", "あいさつ", "Greeting"], ["大事", "だいじ", "Important"], ["終わる", "おわる", "To finish"], ["失礼します", "しつれいします", "Excuse me"], ["先輩", "せんぱい", "Senior worker"], ["店長", "てんちょう", "Store manager"], ["お客さん", "おきゃくさん", "Customer"], ["言葉", "ことば", "Words / language"], ["学ぶ", "まなぶ", "To learn"]], "kanji_used": [["日本", "にほん", "Japan"], ["学生", "がくせい", "Student"], ["外国人", "がいこくじん", "Foreigner"], ["工場", "こうじょう", "Factory"], ["働く", "はたらく", "To work"], ["人", "ひと", "Person"], ["多い", "おおい", "Many"], ["前", "まえ", "Before"], ["仕事", "しごと", "Work"], ["内容", "ないよう", "Contents / details"], ["時間", "じかん", "Time"], ["聞く", "きく", "To ask / listen"], ["守る", "まもる", "To keep / follow"], ["大切", "たいせつ", "Important"], ["早い", "はやい", "Early / fast"], ["会社", "かいしゃ", "Company"], ["店", "みせ", "Shop"], ["連絡", "れんらく", "Contact"], ["大事", "だいじ", "Important"], ["朝", "あさ", "Morning"], ["終わる", "おわる", "To finish"], ["言う", "いう", "To say"], ["分かる", "わかる", "To understand"], ["先輩", "せんぱい", "Senior"], ["店長", "てんちょう", "Store manager"], ["客", "きゃく", "Customer"], ["言葉", "ことば", "Words / language"], ["使う", "つかう", "To use"], ["日本語", "にほんご", "Japanese language"], ["学ぶ", "まなぶ", "To learn"]]}, {"num": "6", "topic": "日本の じてんしゃ 生活（Bicycle Life in Japan）", "jp": "日本では、じてんしゃを 使う 人が とても 多いです。\n学生は 学校へ 行く とき、じてんしゃに 乗る ことが あります。\n会社員も 駅まで じてんしゃで 行く ことが あります。\nスーパーや コンビニへ 行く ときも、じてんしゃは とても 便利です。\nでも、日本では じてんしゃの ルールを 守らなければなりません。\n夜に 乗る ときは、ライトを つけます。\n雨の 日に かさを さして 乗る のは あぶないです。\n駅の 前には、じてんしゃを とめる 場所が あります。\n正しい 場所に とめない と、じてんしゃを 持って行かれる ことも あります。\n日本で 生活する とき、じてんしゃの 使い方を 知っていると とても 役に 立ちます。", "romaji": "Nihon de wa, jitensha o tsukau hito ga totemo ooi desu.\nGakusei wa gakkou e iku toki, jitensha ni noru koto ga arimasu.\nKaishain mo eki made jitensha de iku koto ga arimasu.\nSuupaa ya konbini e iku toki mo, jitensha wa totemo benri desu.\nDemo, Nihon de wa jitensha no ruuru o mamoranakereba narimasen.\nYoru ni noru toki wa, raito o tsukemasu.\nAme no hi ni kasa o sashite noru no wa abunai desu.\nEki no mae ni wa, jitensha o tomeru basho ga arimasu.\nTadashii basho ni tomenai to, jitensha o motte ikareru koto mo arimasu.\nNihon de seikatsu suru toki, jitensha no tsukaikata o shitte iru to totemo yaku ni tachimasu.", "en": "In Japan, many people use bicycles.\nStudents sometimes ride bicycles when they go to school.\nOffice workers also sometimes go by bicycle to the station.\nWhen going to the supermarket or convenience store, bicycles are very convenient.\nHowever, in Japan, you must follow bicycle rules.\nWhen riding at night, you turn on the light.\nIt is dangerous to ride while holding an umbrella on rainy days.\nIn front of stations, there are places to park bicycles.\nIf you do not park in the correct place, your bicycle may be taken away.\nWhen living in Japan, knowing how to use bicycles is very useful.", "vocab": [["じてんしゃ", "じてんしゃ", "Bicycle"], ["使う", "つかう", "To use"], ["学生", "がくせい", "Student"], ["学校", "がっこう", "School"], ["会社員", "かいしゃいん", "Office worker"], ["駅", "えき", "Station"], ["便利", "べんり", "Convenient"], ["ルール", "ルール", "Rule"], ["守る", "まもる", "To follow / protect"], ["夜", "よる", "Night"], ["ライト", "ライト", "Light"], ["雨", "あめ", "Rain"], ["かさ", "かさ", "Umbrella"], ["あぶない", "あぶない", "Dangerous"], ["場所", "ばしょ", "Place"], ["正しい", "ただしい", "Correct"], ["生活", "せいかつ", "Life"], ["役に立つ", "やくにたつ", "Useful"]], "kanji_used": [["日本", "にほん", "Japan"], ["使う", "つかう", "To use"], ["人", "ひと", "Person"], ["多い", "おおい", "Many"], ["学生", "がくせい", "Student"], ["学校", "がっこう", "School"], ["行く", "いく", "To go"], ["乗る", "のる", "To ride"], ["会社員", "かいしゃいん", "Office worker"], ["駅", "えき", "Station"], ["便利", "べんり", "Convenient"], ["守る", "まもる", "To follow"], ["夜", "よる", "Night"], ["雨", "あめ", "Rain"], ["日", "ひ", "Day"], ["前", "まえ", "Front / before"], ["場所", "ばしょ", "Place"], ["正しい", "ただしい", "Correct"], ["持つ", "もつ", "To hold / carry"], ["生活", "せいかつ", "Life"], ["知る", "しる", "To know"], ["役", "やく", "Use / role"], ["立つ", "たつ", "To stand"]]}, {"num": "7", "topic": "日本の レストラン（Japanese Restaurants）", "jp": "日本には、いろいろな レストランが あります。\nラーメン屋、すし屋、カレー屋、ファミリーレストランなどが 人気です。\n店に 入る とき、店員が「いらっしゃいませ」と 言います。\n一人で 食べる 人も 多いので、一人でも 入りやすい 店が たくさん あります。\nメニューを 見て、食べたい 料理を 選びます。\n水や お茶は 無料で 出る ことが 多いです。\n注文する ときは、「これを お願いします」と 言う と 便利です。\n食事が 終わったら、レジで お金を 払います。\n日本では、チップを 払う 必要は ありません。\n日本の レストランを 使う と、日本の 食べ物と マナーを 学ぶ ことが できます。", "romaji": "Nihon ni wa, iroiro na resutoran ga arimasu.\nRaamen-ya, sushi-ya, karee-ya, famirii resutoran nado ga ninki desu.\nMise ni hairu toki, ten’in ga “irasshaimase” to iimasu.\nHitori de taberu hito mo ooi node, hitori demo hairiyasui mise ga takusan arimasu.\nMenyuu o mite, tabetai ryouri o erabimasu.\nMizu ya ocha wa muryou de deru koto ga ooi desu.\nChuumon suru toki wa, “kore o onegai shimasu” to iu to benri desu.\nShokuji ga owattara, reji de okane o haraimasu.\nNihon de wa, chippu o harau hitsuyou wa arimasen.\nNihon no resutoran o tsukau to, Nihon no tabemono to manaa o manabu koto ga dekimasu.", "en": "There are many kinds of restaurants in Japan.\nRamen shops, sushi shops, curry shops, and family restaurants are popular.\nWhen you enter a shop, the staff says, “Welcome.”\nBecause many people eat alone, there are many shops that are easy to enter alone.\nYou look at the menu and choose the food you want to eat.\nWater and tea are often served for free.\nWhen ordering, it is convenient to say, “This, please.”\nWhen the meal is finished, you pay money at the register.\nIn Japan, you do not need to pay a tip.\nBy using Japanese restaurants, you can learn Japanese food and manners.", "vocab": [["レストラン", "レストラン", "Restaurant"], ["ラーメン屋", "ラーメンや", "Ramen shop"], ["すし屋", "すしや", "Sushi shop"], ["店", "みせ", "Shop"], ["店員", "てんいん", "Shop staff"], ["一人", "ひとり", "One person / alone"], ["食べる", "たべる", "To eat"], ["メニュー", "メニュー", "Menu"], ["料理", "りょうり", "Food / dish"], ["選ぶ", "えらぶ", "To choose"], ["水", "みず", "Water"], ["お茶", "おちゃ", "Tea"], ["無料", "むりょう", "Free of charge"], ["注文", "ちゅうもん", "Order"], ["食事", "しょくじ", "Meal"], ["お金", "おかね", "Money"], ["払う", "はらう", "To pay"], ["必要", "ひつよう", "Necessary"], ["学ぶ", "まなぶ", "To learn"]], "kanji_used": [["日本", "にほん", "Japan"], ["屋", "や", "Shop"], ["人気", "にんき", "Popular"], ["店", "みせ", "Shop"], ["入る", "はいる", "To enter"], ["店員", "てんいん", "Staff"], ["言う", "いう", "To say"], ["一人", "ひとり", "One person"], ["食べる", "たべる", "To eat"], ["人", "ひと", "Person"], ["多い", "おおい", "Many"], ["見る", "みる", "To see"], ["料理", "りょうり", "Cooking / dish"], ["選ぶ", "えらぶ", "To choose"], ["水", "みず", "Water"], ["茶", "ちゃ", "Tea"], ["無料", "むりょう", "Free"], ["出る", "でる", "To come out"], ["注文", "ちゅうもん", "Order"], ["食事", "しょくじ", "Meal"], ["終わる", "おわる", "To finish"], ["お金", "おかね", "Money"], ["払う", "はらう", "To pay"], ["必要", "ひつよう", "Necessary"], ["食べ物", "たべもの", "Food"], ["学ぶ", "まなぶ", "To learn"]]}, {"num": "8", "topic": "日本の こうえん（Japanese Parks）", "jp": "日本の 町には、こうえんが よく あります。\nこうえんは、子どもだけでなく、大人にも 人気の 場所です。\n朝、こうえんで さんぽを する 人が います。\n昼には、子どもが 友だちと 遊んでいます。\n春には、さくらを 見る ために 多くの 人が こうえんへ 行きます。\nベンチに 座って、おべんとうを 食べる 人も います。\nこうえんでは、ごみを 持って帰る ことが 大切です。\n大きな 声で さわいだり、花を とったり してはいけません。\n雨の あとは、地面が すべりやすいので 気を つけます。\n日本の こうえんは、休む ためにも、自然を 楽しむ ためにも よい 場所です。", "romaji": "Nihon no machi ni wa, kouen ga yoku arimasu.\nKouen wa, kodomo dake de naku, otona ni mo ninki no basho desu.\nAsa, kouen de sanpo o suru hito ga imasu.\nHiru ni wa, kodomo ga tomodachi to asonde imasu.\nHaru ni wa, sakura o miru tame ni ooku no hito ga kouen e ikimasu.\nBenchi ni suwatte, obentou o taberu hito mo imasu.\nKouen de wa, gomi o motte kaeru koto ga taisetsu desu.\nOokina koe de sawaidari, hana o tottari shite wa ikemasen.\nAme no ato wa, jimen ga suberiyasui node ki o tsukemasu.\nNihon no kouen wa, yasumu tame ni mo, shizen o tanoshimu tame ni mo yoi basho desu.", "en": "There are often parks in Japanese towns.\nParks are popular places not only for children but also for adults.\nIn the morning, some people take walks in parks.\nIn the afternoon, children play with friends.\nIn spring, many people go to parks to see cherry blossoms.\nSome people sit on benches and eat lunch boxes.\nIn parks, it is important to take your garbage home.\nYou must not make loud noise or pick flowers.\nAfter rain, the ground is slippery, so you should be careful.\nJapanese parks are good places to rest and enjoy nature.", "vocab": [["こうえん", "こうえん", "Park"], ["町", "まち", "Town"], ["子ども", "こども", "Child"], ["大人", "おとな", "Adult"], ["人気", "にんき", "Popular"], ["場所", "ばしょ", "Place"], ["朝", "あさ", "Morning"], ["さんぽ", "さんぽ", "Walk"], ["昼", "ひる", "Afternoon / noon"], ["友だち", "ともだち", "Friend"], ["遊ぶ", "あそぶ", "To play"], ["春", "はる", "Spring"], ["さくら", "さくら", "Cherry blossom"], ["座る", "すわる", "To sit"], ["花", "はな", "Flower"], ["地面", "じめん", "Ground"], ["自然", "しぜん", "Nature"], ["楽しむ", "たのしむ", "To enjoy"]], "kanji_used": [["日本", "にほん", "Japan"], ["町", "まち", "Town"], ["子ども", "こども", "Child"], ["大人", "おとな", "Adult"], ["人気", "にんき", "Popular"], ["場所", "ばしょ", "Place"], ["朝", "あさ", "Morning"], ["人", "ひと", "Person"], ["昼", "ひる", "Noon / daytime"], ["友だち", "ともだち", "Friend"], ["遊ぶ", "あそぶ", "To play"], ["春", "はる", "Spring"], ["見る", "みる", "To see"], ["多い", "おおい", "Many"], ["行く", "いく", "To go"], ["座る", "すわる", "To sit"], ["食べる", "たべる", "To eat"], ["持つ", "もつ", "To hold / carry"], ["帰る", "かえる", "To return"], ["大切", "たいせつ", "Important"], ["大きい", "おおきい", "Big"], ["声", "こえ", "Voice"], ["花", "はな", "Flower"], ["雨", "あめ", "Rain"], ["後", "あと", "After"], ["地面", "じめん", "Ground"], ["気", "き", "Spirit / care"], ["休む", "やすむ", "To rest"], ["自然", "しぜん", "Nature"], ["楽しむ", "たのしむ", "To enjoy"]]}, {"num": "9", "topic": "日本の 宅配便（Delivery Service in Japan）", "jp": "日本では、宅配便の サービスが とても 便利です。\n荷物を 家まで 届けて もらう ことが できます。\nインターネットで 買い物を すると、商品が 宅配便で 来る ことが 多いです。\n家に いない ときは、不在票が ポストに 入っています。\n不在票には、荷物の 番号や 配達の 会社の 名前が 書いてあります。\nもう一度 配達して ほしい ときは、電話や インターネットで 連絡します。\n時間を 決めて、荷物を 受け取る ことも できます。\n荷物を 受け取る ときは、名前を 書いたり、はんこを 使ったり します。\nコンビニで 荷物を 受け取る ことが できる 場合も あります。\n日本で 生活する とき、宅配便を 使える と とても 便利です。", "romaji": "Nihon de wa, takuhaibin no saabisu ga totemo benri desu.\nNimotsu o ie made todokete morau koto ga dekimasu.\nIntaanetto de kaimono o suru to, shouhin ga takuhaibin de kuru koto ga ooi desu.\nIe ni inai toki wa, fuzaihyou ga posuto ni haitte imasu. ings and glass.\nTo live safely in Japan, it is necessary to know what to do during an earthquake.", "vocab": [["地震", "じしん", "Earthquake"], ["起こる", "おこる", "To happen"], ["そなえ", "そなえ", "Preparation"], ["大切", "たいせつ", "Important"], ["家", "いえ", "House / home"], ["水", "みず", "Water"], ["食べ物", "たべもの", "Food"], ["電池", "でんち", "Battery"], ["用意", "ようい", "Preparation"], ["安心", "あんしん", "Relief / safe feeling"], ["電気", "でんき", "Electricity"], ["ガス", "ガス", "Gas"], ["止まる", "とまる", "To stop"], ["帰る", "かえる", "To return"], ["ひなん", "ひなん", "Evacuation"], ["くんれん", "くんれん", "Training / drill"], ["頭", "あたま", "Head"], ["守る", "まもる", "To protect"], ["机", "つくえ", "Desk"], ["安全", "あんぜん", "Safety"], ["建物", "たてもの", "Building"], ["必要", "ひつよう", "Necessary"]], "kanji_used": [["日本", "にほん", "Japan"], ["地震", "じしん", "Earthquake"], ["起こる", "おこる", "To happen"], ["大切", "たいせつ", "Important"], ["家", "いえ", "House"], ["水", "みず", "Water"], ["食べ物", "たべもの", "Food"], ["電池", "でんち", "Battery"], ["用意", "ようい", "Preparation"], ["安心", "あんしん", "Relief"], ["大きい", "おおきい", "Big"], ["電気", "でんき", "Electricity"], ["止まる", "とまる", "To stop"], ["電車", "でんしゃ", "Train"], ["帰る", "かえる", "To return"], ["学校", "がっこう", "School"], ["会社", "かいしゃ", "Company"], ["来る", "くる", "To come"], ["頭", "あたま", "Head"], ["守る", "まもる", "To protect"], ["机", "つくえ", "Desk"], ["下", "した", "Under"], ["入る", "はいる", "To enter"], ["安全", "あんぜん", "Safety"], ["場所", "ばしょ", "Place"], ["行く", "いく", "To go"], ["外", "そと", "Outside"], ["建物", "たてもの", "Building"], ["何", "なに", "What"], ["知る", "しる", "To know"], ["必要", "ひつよう", "Necessary"], ["生活", "せいかつ", "Life"]]}]};

<script>
/* Japanese with Raza Sensei — Practice Companion app logic
   A drills-only extract of the main course: warm-ups, practice blocks,
   checkpoint quizzes, homework, and the mock exam — no teaching content. */
(function () {
  'use strict';
  const DATA = window.COURSE_DATA;
  const PARTS = DATA.parts;
  const SESSIONS = DATA.sessions;
  const MOCK = DATA.mock_exam;

  // ---------- storage (best-effort, per-viewer only) ----------
  const STORE_KEY = 'jwrs_practice_progress_v1';
  function loadProgress() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || { done: {} }; }
    catch (e) { return { done: {} }; }
  }
  function saveProgress(p) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(p)); } catch (e) {}
  }
  let progress = loadProgress();

  // ---------- furigana + basic helpers ----------
  function furigana(text) {
    if (!text) return '';
    return text.replace(/([一-鿿々〆〇]+)\(([ぁ-んー]+)\)/g, '<ruby>$1<rt>$2</rt></ruby>');
  }
  function esc(s) {
    return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function plainJp(text) {
    // strip furigana parens for TTS/plain-text use: "本(ほん)" -> "本"
    return (text || '').replace(/([一-鿿々〆〇]+)\([ぁ-んー]+\)/g, '$1');
  }

  // ---------- speech ----------
  let voices = [];
  function loadVoices() { voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; }
  if (window.speechSynthesis) {
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }
  function speak(text, rate) {
    if (!window.speechSynthesis) { alert('Your browser does not support built-in text-to-speech.'); return; }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(plainJp(text));
    u.lang = 'ja-JP';
    u.rate = rate || 0.9;
    const jaVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('ja'));
    if (jaVoice) u.voice = jaVoice;
    window.speechSynthesis.speak(u);
  }
  const SPEAK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18 6a9 9 0 0 1 0 12"></path></svg>';

  function speakBtn(text, extraClass) {
    const safe = esc(plainJp(text)).replace(/'/g, '&#39;');
    return `<button class="speak-btn ${extraClass||''}" title="Listen" onclick="App.speak('${safe.replace(/"/g,'&quot;')}')">${SPEAK_ICON}</button>`;
  }

  // ---------- icons (inline SVG, thematic, no external assets) ----------
  const ICONS = {
    kana: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19V5a1 1 0 0 1 1-1h11l4 4v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1Z"/><path d="M15 4v4h4"/><path d="M8 13h8M8 17h5"/></svg>',
    grammar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M8 12h8M12 8v8"/></svg>',
    vocab: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5v-15Z"/><path d="M8 3v15"/></svg>',
    kanji: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v18M4 8h16M7 8c0 6-1 9-4 12M17 8c0 3 .5 5 3 6M9 14h6"/></svg>',
    review: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>',
    reading: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 6.5c-1.7-1.2-4-2-6.5-2v13c2.5 0 4.8.8 6.5 2 1.7-1.2 4-2 6.5-2V4.5c-2.5 0-4.8.8-6.5 2Z"/><path d="M12 6.5V19"/></svg>',
    warmup: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="5"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>',
    practice: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',

    listen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 10v4h4l5 5V5L7 10H3Z"/><path d="M16 8a5 5 0 0 1 0 8"/></svg>',
    story: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="8" height="8" rx="1"/><path d="M3 17h8M15 8h6M15 12h6M15 16h4"/><circle cx="7" cy="9" r="1.2" fill="currentColor" stroke="none"/></svg>',
  };
  function icon(name) { return `<span class="stage-icon">${ICONS[name] || ICONS.review}</span>`; }

  // ---------- routing ----------
  function currentRoute() {
    const h = location.hash.replace(/^#\/?/, '');
    if (!h || h === 'home') return { view: 'home' };
    if (h === 'exam') return { view: 'exam' };
    const m = h.match(/^session\/(\d+)/);
    if (m) return { view: 'session', num: parseInt(m[1], 10) };
    return { view: 'home' };
  }
  window.addEventListener('hashchange', render);

  // ---------- sidebar ----------
  function weeksForPart(partId) {
    const weeks = {};
    SESSIONS.forEach((s, i) => {
      if (s.part !== partId) return;
      weeks[s.week] = weeks[s.week] || [];
      weeks[s.week].push(i);
    });
    return weeks;
  }

  function buildSidebar(active) {
    const totalDone = Object.keys(progress.done).length;
    const pct = Math.round((totalDone / SESSIONS.length) * 100);
    let html = `
    <div class="sidebar-head">
      <div class="brand-mark">
        <div class="brand-seal">${ICONS.kanji.replace('viewBox="0 0 24 24"','viewBox="0 0 24 24" width="18" height="18"')}</div>
        <div class="brand-text">

  // ---------- quiz engine (shared by checkpoint quizzes + mock exam) ----------
  function quizHtml(quiz, idPrefix) {
    let html = `<div class="quiz-card"><p>${esc(quiz.instructions)}</p><div id="${idPrefix}-banner"></div>`;
    quiz.questions.forEach((q, i) => {
      html += `<div class="quiz-q" data-qid="${q.id}">
        <div class="quiz-prompt">${i+1}. ${furigana(esc(q.prompt))} ${q.audio ? speakBtn(q.audio) : ''}</div>
        <div class="quiz-options">
          ${q.options.map((opt, oi) => `<label class="quiz-option" data-value="${esc(opt)}">
            <input type="radio" name="${idPrefix}-q${q.id}" value="${esc(opt)}"> <span class="jp">${furigana(esc(opt))}</span>
          </label>`).join('')}
        </div>
        ${q.note ? `<div class="quiz-note">${esc(q.note)}</div>` : ''}
      </div>`;
    });
    html += `<button class="icon-btn primary" onclick="App.scoreQuiz('${idPrefix}')">Check my answers</button></div>`;
    return html;
  }

  const QUIZ_REGISTRY = {};
  function wireQuiz(idPrefix, quiz) {
    QUIZ_REGISTRY[idPrefix] = quiz;
    document.querySelectorAll(`[name^="${idPrefix}-q"]`).forEach(input => {
      input.addEventListener('change', e => {
        const qDiv = e.target.closest('.quiz-q');
        qDiv.querySelectorAll('.quiz-option').forEach(o => o.classList.remove('selected'));
        e.target.closest('.quiz-option').classList.add('selected');
      });
    });
  }

  App.scoreQuiz = function (idPrefix) {
    const quiz = QUIZ_REGISTRY[idPrefix];
    if (!quiz) return;
    let correct = 0;
    quiz.questions.forEach(q => {
      const qDiv = document.querySelector(`.quiz-q[data-qid="${q.id}"]`);
      if (!qDiv) return;
      const chosen = qDiv.querySelector(`input[name="${idPrefix}-q${q.id}"]:checked`);
      qDiv.querySelectorAll('.quiz-option').forEach(opt => {
        opt.classList.remove('correct', 'incorrect');
        if (opt.dataset.value === q.answer) opt.classList.add('correct');
      });
      if (chosen) {
        if (chosen.value === q.answer) correct++;
        else chosen.closest('.quiz-option').classList.add('incorrect');
      }
      const note = qDiv.querySelector('.quiz-note');
      if (note) note.classList.add('shown');
    });
    const pct = Math.round((correct / quiz.questions.length) * 100);
    const pass = pct >= (quiz.passmark_pct || 70);
    const banner = document.getElementById(idPrefix + '-banner');
    if (banner) {
      banner.innerHTML = `<div class="quiz-score-banner ${pass ? 'pass' : 'fail'}">
        <div class="quiz-score-big">${correct} / ${quiz.questions.length} — ${pct}%</div>
        <div>${pass ? 'You passed this checkpoint. Well done.' : 'Below the 70% checkpoint — review the flagged items above and try again in a day or two.'}</div>
      </div>`;
      banner.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  };

        </div>
        <div class="content" id="content"></div>
      </div>`;
    render();
  });

  App.toggleTheme = function () {
    const root = document.documentElement;
    const cur = root.getAttribute('data-theme');
    if (cur === 'dark') root.setAttribute('data-theme', 'light');
    else if (cur === 'light') root.removeAttribute('data-theme');
    else root.setAttribute('data-theme', 'dark');
  };
})();

</script>
</body>
</html>

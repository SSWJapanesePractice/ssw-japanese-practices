<style>
:root{--ink:#142433;--steel:#33495e;--muted:#637789;--paper:#eef2f4;--panel:#fff;--line:#d6dee4;--amber:#f2a41c;--green:#2f9e63;--red:#d6493a;--shadow:0 10px 30px rgba(20,35,50,.08)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.65}
button,input{font:inherit}
header{background:linear-gradient(135deg,#142433,#24394b);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 3px 16px #0002}
.head{max-width:1250px;margin:auto;padding:18px 22px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{flex:1;min-width:260px}
.eyebrow{color:var(--amber);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800}
h1{margin:2px 0;font-size:clamp(22px,3vw,34px)}
.sub{color:#b9c7d2;font-size:13px}
.pill{border:1px solid #ffffff33;background:#ffffff10;padding:8px 12px;border-radius:999px;font-size:12px}
nav{max-width:1250px;margin:auto;padding:0 22px 14px;display:flex;gap:8px;overflow:auto}
nav button,.tab{border:1px solid #ffffff25;background:#ffffff0d;color:#fff;border-radius:9px;padding:8px 12px;cursor:pointer;white-space:nowrap}
nav button.active,.tab.active{background:#fff;color:var(--ink)}
main{max-width:1250px;margin:26px auto 70px;padding:0 22px}
.hero{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--shadow);margin-bottom:20px}
.hero h2{font-size:32px;margin:0 0 5px}
.hero p{color:var(--muted);max-width:850px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.stat{padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:#fafcfd}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.tabs button{border:1px solid var(--line);background:var(--panel);color:var(--steel);border-radius:9px;padding:9px 13px;cursor:pointer}
.tabs button.active{background:var(--ink);color:#fff}
.layout{display:grid;grid-template-columns:280px 1fr;gap:18px}
@media(max-width:850px){.layout{grid-template-columns:1fr}}
.sidebar{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;height:max-content;position:sticky;top:145px}
@media(max-width:850px){.sidebar{position:static}}
.search{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:12px}
.module{width:100%;display:grid;grid-template-columns:48px 1fr 20px;text-align:left;gap:10px;align-items:center;border:1px solid var(--line);background:#fbfcfd;border-radius:10px;padding:10px;margin:6px 0;cursor:pointer;color:var(--ink)}
.module:hover{border-color:var(--steel)}
.module .code{font-size:11px;font-weight:800;color:var(--amber);background:#172838;border-radius:7px;padding:5px;text-align:center}
.module small{display:block;color:var(--muted);font-size:11px;line-height:1.4;margin-top:2px}
.arrow{color:var(--steel)}
.source-wrap{display:none}
.source-wrap.active{display:block}
.source-page{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px 20px;margin-bottom:12px;box-shadow:0 2px 8px #1424330a}
.page-num{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--amber);margin-bottom:8px}
.page-text{font-family:"Noto Sans JP",system-ui,sans-serif;white-space:normal;word-break:break-word}
.notice{padding:12px 14px;background:#fff8e8;border:1px solid #f2d28d;border-radius:10px;color:#6a4a08;font-size:13px;margin:12px 0}
.quiz-card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:22px;box-shadow:var(--shadow)}
.quiz-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.partbar{display:flex;gap:6px;flex-wrap:wrap;margin:15px 0}
.partbar button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 9px;cursor:pointer;font-size:12px}
.partbar button.active{background:var(--ink);color:#fff}
.qnum{display:inline-block;background:var(--steel);color:#fff;border-radius:999px;padding:4px 10px;font-size:12px}
.qjp{font-size:20px;font-weight:800;line-height:2;margin:12px 0 5px}
.qen{color:var(--muted);font-style:italic}
.option{display:flex;gap:10px;border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin:8px 0;cursor:pointer;background:#fbfcfd}
.option:hover{border-color:var(--steel)}
.option.correct{background:#e8f6ef;border-color:var(--green)}
.option.wrong{background:#fdecea;border-color:var(--red)}
.lab{font-weight:800;color:var(--steel)}
.qnav{display:flex;justify-content:space-between;margin-top:18px}
.btn{border:0;background:var(--ink);color:#fff;padding:10px 15px;border-radius:9px;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.score{font-weight:800}
.gloss{width:100%;border-collapse:collapse}
.gloss th,.gloss td{border-bottom:1px solid var(--line);padding:9px;text-align:left;vertical-align:top}
footer{background:#142433;color:#b8c5cf;padding:30px 22px;text-align:center;font-size:12px}
.hidden{display:none!important}
</style>
